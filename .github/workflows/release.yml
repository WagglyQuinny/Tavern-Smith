                  return rel != "." and not rel.startswith("..") and not os.path.isabs(rel)
              except Exception:
                  return False

          def has_workspace_confined_ancestor(root_dir, candidate_path):
              probe = candidate_path
              while not os.path.exists(probe):
                  parent = os.path.dirname(probe)
                  if parent == probe:
                      break
                  probe = parent
              try:
                  real_ancestor = os.path.realpath(probe) if os.path.exists(probe) else probe
                  rel = os.path.relpath(real_ancestor, root_dir)
                  return rel == "." or (not rel.startswith("..") and not os.path.isabs(rel))
              except Exception:
