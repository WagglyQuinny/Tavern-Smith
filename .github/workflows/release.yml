name: Standalone Release Push & Portable Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    name: Build Standalone Portable App & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 24 (Native Action, No Lockfile Cache)
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript Verification
        run: npm run lint

      - name: Build Production Standalone Bundle & Strip crossorigin for Direct file:// Support
        run: |
          npm run build
          node -e '
            const fs = require("fs");
            const indexPath = "dist/index.html";
            if (fs.existsSync(indexPath)) {
              let html = fs.readFileSync(indexPath, "utf8");
              html = html.replace(/\s+crossorigin(?:="[^"]*")?/gi, "");
              fs.writeFileSync(indexPath, html, "utf8");
              console.log("Stripped crossorigin attributes from dist/index.html.");
            }
          '

      - name: Generate Zero-Dependency Local Disk Servers (server.cjs + server.py) & Launchers Inside dist/
        run: |
          sed 's/^          //' << 'EOF' > dist/server.cjs
          #!/usr/bin/env node
          const http = require('http');
          const fs = require('fs');
          const path = require('path');

          const PORT = Number(process.env.PORT || 4173);
          const HOST = '127.0.0.1';
          const ROOT_DIR = __dirname;
          const META_FILENAME = '_tavernsmith_meta.json';
          const VAULT_FILENAME = '_tavernsmith_vault.enc';

          const MIME_TYPES = {
            '.html': 'text/html; charset=utf-8',
            '.js': 'application/javascript; charset=utf-8',
            '.mjs': 'application/javascript; charset=utf-8',
            '.css': 'text/css; charset=utf-8',
            '.json': 'application/json; charset=utf-8',
            '.svg': 'image/svg+xml',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.jpeg': 'image/jpeg',
            '.webp': 'image/webp',
            '.ico': 'image/x-icon',
          };

          function sanitizeDiskFileName(raw) {
            const base = path.basename(String(raw || 'untitled')).replace(/\.json$/i, '');
            const clean =
              base
                .trim()
                .replace(/[^a-zA-Z0-9_-]+/g, '_')
                .replace(/^_+|_+$/g, '') || 'untitled';
            return `${clean}.json`;
          }

          function resolveSavesRoot(customSavePath) {
            const trimmed = (customSavePath || '').trim();
            const useCustom =
              trimmed &&
              trimmed !== './Saves' &&
              trimmed !== './Saves/' &&
              trimmed !== '/Saves/';
            const resolvedPath = useCustom
              ? (path.isAbsolute(trimmed) ? trimmed : path.resolve(ROOT_DIR, trimmed))
              : path.resolve(ROOT_DIR, 'Saves');
            const diskRoot = useCustom ? trimmed : './Saves/';
            const charsDir = path.join(resolvedPath, 'Characters');
            const loreDir = path.join(resolvedPath, 'Lorebooks');
            const themesDir = path.join(resolvedPath, 'Themes');
            const tagsDir = path.join(resolvedPath, 'Tags');

            fs.mkdirSync(resolvedPath, { recursive: true });
            fs.mkdirSync(charsDir, { recursive: true });
            fs.mkdirSync(loreDir, { recursive: true });
            fs.mkdirSync(themesDir, { recursive: true });
            fs.mkdirSync(tagsDir, { recursive: true });

            return { diskRoot, resolvedPath, charsDir, loreDir, themesDir, tagsDir };
          }

          function extractEntityIdFromJson(parsed) {
            if (!parsed || typeof parsed !== 'object') return '';
            const source =
              parsed.payload && typeof parsed.payload === 'object' && !Array.isArray(parsed.payload)
                ? parsed.payload
                : parsed;
            if (typeof source.id === 'string' && source.id.trim()) {
              return source.id.trim();
            }
            if (source.data && typeof source.data === 'object') {
              if (typeof source.data.id === 'string' && source.data.id.trim()) {
                return source.data.id.trim();
              }
              if (
                source.data.extensions &&
                typeof source.data.extensions === 'object' &&
                source.data.extensions.tavernsmith &&
                typeof source.data.extensions.tavernsmith === 'object' &&
                typeof source.data.extensions.tavernsmith.id === 'string' &&
                source.data.extensions.tavernsmith.id.trim()
              ) {
                return source.data.extensions.tavernsmith.id.trim();
              }
            }
            if (
              source.extensions &&
              typeof source.extensions === 'object' &&
              source.extensions.tavernsmith &&
              typeof source.extensions.tavernsmith === 'object' &&
              typeof source.extensions.tavernsmith.id === 'string' &&
              source.extensions.tavernsmith.id.trim()
            ) {
              return source.extensions.tavernsmith.id.trim();
            }
            return '';
          }

          function reserveUniqueDiskFileName(preferredName, usedNamesLower) {
            const initial = sanitizeDiskFileName(preferredName);
            const stem = initial.replace(/\.json$/i, '');
            let candidate = initial;
            let suffix = 2;
            while (usedNamesLower.has(candidate.toLowerCase())) {
              candidate = `${stem}_${suffix}.json`;
              suffix++;
            }
            usedNamesLower.add(candidate.toLowerCase());
            return candidate;
          }

          function scanSavesDirectoryOnDisk(customSavePath) {
            const { diskRoot, resolvedPath, charsDir, loreDir, themesDir, tagsDir } =
              resolveSavesRoot(customSavePath);

            const characters = [];
            const lorebooks = [];
            const themes = [];
            const tags = [];
            let meta = null;
            let vault = null;
            const files = [];

            if (fs.existsSync(charsDir)) {
              const charEntries = fs
                .readdirSync(charsDir, { withFileTypes: true })
                .filter((d) => d.isFile() && d.name.toLowerCase().endsWith('.json'))
                .sort((a, b) => a.name.localeCompare(b.name));

              for (const entry of charEntries) {
                const fullPath = path.join(charsDir, entry.name);
                try {
                  const stat = fs.statSync(fullPath);
                  const content = fs.readFileSync(fullPath, 'utf8');
                  const parsed = JSON.parse(content);
                  if (parsed._tavernsmithType === 'lorebook') continue;
                  characters.push({
                    ...parsed,
                    _diskFileName: entry.name,
                    _diskUpdatedAt: stat.mtime.toISOString(),
                  });
                  files.push({
                    id: `Characters/${entry.name}`,
                    folderPath: 'Characters/',
                    fileName: entry.name,
                    kind: 'character',
                    sizeBytes: stat.size,
                    updatedAt: stat.mtime.toISOString(),
                    content,
                  });
                } catch {
                  // Ignore unreadable or corrupted JSON file
                }
              }
            }

            if (fs.existsSync(loreDir)) {
              const loreEntries = fs
                .readdirSync(loreDir, { withFileTypes: true })
                .filter((d) => d.isFile() && d.name.toLowerCase().endsWith('.json'))
                .sort((a, b) => a.name.localeCompare(b.name));

              for (const entry of loreEntries) {
                const fullPath = path.join(loreDir, entry.name);
                try {
                  const stat = fs.statSync(fullPath);
                  const content = fs.readFileSync(fullPath, 'utf8');
                  const parsed = JSON.parse(content);
                  if (parsed._tavernsmithType === 'character') continue;
                  lorebooks.push({
                    ...parsed,
                    _tavernsmithType: 'lorebook',
                    _diskFileName: entry.name,
                    _diskUpdatedAt: stat.mtime.toISOString(),
                  });
                  files.push({
                    id: `Lorebooks/${entry.name}`,
                    folderPath: 'Lorebooks/',
                    fileName: entry.name,
                    kind: 'lorebook',
                    sizeBytes: stat.size,
                    updatedAt: stat.mtime.toISOString(),
                    content,
                  });
                } catch {
                  // Ignore unreadable or corrupted JSON file
                }
              }
            }

            if (fs.existsSync(themesDir)) {
              const themeEntries = fs
                .readdirSync(themesDir, { withFileTypes: true })
                .filter((d) => d.isFile() && d.name.toLowerCase().endsWith('.json'))
                .sort((a, b) => a.name.localeCompare(b.name));

              for (const entry of themeEntries) {
                const fullPath = path.join(themesDir, entry.name);
                try {
                  const stat = fs.statSync(fullPath);
                  const content = fs.readFileSync(fullPath, 'utf8');
                  const parsed = JSON.parse(content);
                  if (parsed && typeof parsed === 'object') {
                    themes.push({
                      ...parsed,
                      _tavernsmithType: 'theme',
                      _diskFileName: entry.name,
                      _diskUpdatedAt: stat.mtime.toISOString(),
                    });
                    files.push({
                      id: `Themes/${entry.name}`,
                      folderPath: 'Themes/',
                      fileName: entry.name,
                      kind: 'theme',
                      sizeBytes: stat.size,
                      updatedAt: stat.mtime.toISOString(),
                      content,
                    });
                  }
                } catch {
                  // Ignore unreadable or corrupted JSON file
                }
              }
            }

            if (fs.existsSync(tagsDir)) {
              const tagEntries = fs
                .readdirSync(tagsDir, { withFileTypes: true })
                .filter((d) => d.isFile() && d.name.toLowerCase().endsWith('.json'))
                .sort((a, b) => a.name.localeCompare(b.name));

              for (const entry of tagEntries) {
                const fullPath = path.join(tagsDir, entry.name);
                try {
                  const stat = fs.statSync(fullPath);
                  const content = fs.readFileSync(fullPath, 'utf8');
                  const parsed = JSON.parse(content);
                  if (parsed && typeof parsed === 'object') {
                    tags.push({
                      ...parsed,
                      _tavernsmithType: 'tag',
                      _diskFileName: entry.name,
                      _diskUpdatedAt: stat.mtime.toISOString(),
                    });
                    files.push({
                      id: `Tags/${entry.name}`,
                      folderPath: 'Tags/',
                      fileName: entry.name,
                      kind: 'tag',
                      sizeBytes: stat.size,
                      updatedAt: stat.mtime.toISOString(),
                      content,
                    });
                  }
                } catch {
                  // Ignore unreadable or corrupted JSON file
                }
              }
            }

            const metaPath = path.join(resolvedPath, META_FILENAME);
            if (fs.existsSync(metaPath)) {
              try {
                const stat = fs.statSync(metaPath);
                const content = fs.readFileSync(metaPath, 'utf8');
                meta = JSON.parse(content);
                files.push({
                  id: `/${META_FILENAME}`,
                  folderPath: '/',
                  fileName: META_FILENAME,
                  kind: 'meta',
                  sizeBytes: stat.size,
                  updatedAt: stat.mtime.toISOString(),
                  content,
                });
              } catch {
                // Ignore malformed meta
              }
            }

            const vaultPath = path.join(resolvedPath, VAULT_FILENAME);
            if (fs.existsSync(vaultPath)) {
              try {
                const stat = fs.statSync(vaultPath);
                const content = fs.readFileSync(vaultPath, 'utf8');
                vault = JSON.parse(content);
                files.push({
                  id: `/${VAULT_FILENAME}`,
                  folderPath: '/',
                  fileName: VAULT_FILENAME,
                  kind: 'vault',
                  sizeBytes: stat.size,
                  updatedAt: stat.mtime.toISOString(),
                  content,
                });
              } catch {
                // Ignore malformed vault
              }
            }

            return {
              ok: true,
              diskRoot,
              resolvedPath,
              characters,
              lorebooks,
              themes,
              tags,
              meta,
              vault,
              files,
              updatedAt: new Date().toISOString(),
            };
          }

          function saveToSavesDirectoryOnDisk(body) {
            const customSavePath =
              typeof body.customSavePath === 'string'
                ? body.customSavePath
                : typeof body.savesDir === 'string'
                  ? body.savesDir
                  : undefined;
            const { resolvedPath, charsDir, loreDir, themesDir, tagsDir } =
              resolveSavesRoot(customSavePath);

            if (Array.isArray(body.characters)) {
              const usedCharTargets = new Set();
              const writtenCharFiles = new Set();

              for (const item of body.characters) {
                if (!item || typeof item !== 'object') continue;
                const payload = item.payload || item;
                if (payload._tavernsmithType === 'lorebook') continue;
                const rawName =
                  item.fileName ||
                  (payload.data &&
                  typeof payload.data === 'object' &&
                  typeof payload.data.name === 'string'
                    ? String(payload.data.name)
                    : typeof payload.name === 'string'
                      ? payload.name
                      : 'untitled');
                const targetFileName = reserveUniqueDiskFileName(rawName, usedCharTargets);
                const outContent =
                  typeof item.content === 'string'
                    ? item.content
                    : JSON.stringify(
                        {
                          ...payload,
                          _tavernsmithType: 'character',
                        },
                        null,
                        2
                      );

                fs.writeFileSync(path.join(charsDir, targetFileName), outContent, 'utf8');
                writtenCharFiles.add(targetFileName.toLowerCase());
              }

              try {
                for (const fileName of fs.readdirSync(charsDir)) {
                  if (!fileName.toLowerCase().endsWith('.json')) continue;
                  if (!writtenCharFiles.has(fileName.toLowerCase())) {
                    const orphanPath = path.join(charsDir, fileName);
                    if (fs.existsSync(orphanPath)) fs.unlinkSync(orphanPath);
                  }
                }
              } catch {}
            }

            if (Array.isArray(body.lorebooks)) {
              const usedLoreTargets = new Set();
              const writtenBookFiles = new Set();

              for (const item of body.lorebooks) {
                if (!item || typeof item !== 'object') continue;
                const payload = item.payload || item;
                if (payload._tavernsmithType === 'character') continue;
                const rawName =
                  item.fileName ||
                  (typeof payload.name === 'string' ? payload.name : 'untitled_lorebook');
                const targetFileName = reserveUniqueDiskFileName(rawName, usedLoreTargets);
                const outContent =
                  typeof item.content === 'string'
                    ? item.content
                    : JSON.stringify(
                        {
                          ...payload,
                          _tavernsmithType: 'lorebook',
                        },
                        null,
                        2
                      );

                fs.writeFileSync(path.join(loreDir, targetFileName), outContent, 'utf8');
                writtenBookFiles.add(targetFileName.toLowerCase());
              }

              try {
                for (const fileName of fs.readdirSync(loreDir)) {
                  if (!fileName.toLowerCase().endsWith('.json')) continue;
                  if (!writtenBookFiles.has(fileName.toLowerCase())) {
                    const orphanPath = path.join(loreDir, fileName);
                    if (fs.existsSync(orphanPath)) fs.unlinkSync(orphanPath);
                  }
                }
              } catch {}
            }

            if (Array.isArray(body.themes)) {
              const usedThemeTargets = new Set();
              const writtenThemeFiles = new Set();

              for (const item of body.themes) {
                if (!item || typeof item !== 'object') continue;
                const payload = item.payload || item;
                const rawName =
                  item.fileName ||
                  (typeof payload.name === 'string' ? payload.name : 'custom_theme');
                const targetFileName = reserveUniqueDiskFileName(rawName, usedThemeTargets);
                const outContent =
                  typeof item.content === 'string'
                    ? item.content
                    : JSON.stringify({
                        ...payload,
                        _tavernsmithType: 'theme',
                      });

                fs.writeFileSync(path.join(themesDir, targetFileName), outContent, 'utf8');
                writtenThemeFiles.add(targetFileName.toLowerCase());
              }

              try {
                for (const fileName of fs.readdirSync(themesDir)) {
                  if (!fileName.toLowerCase().endsWith('.json')) continue;
                  if (!writtenThemeFiles.has(fileName.toLowerCase())) {
                    const orphanPath = path.join(themesDir, fileName);
                    if (fs.existsSync(orphanPath)) fs.unlinkSync(orphanPath);
                  }
                }
              } catch {}
            }

            if (Array.isArray(body.tags)) {
              const usedTagTargets = new Set();
              const writtenTagFiles = new Set();

              for (const item of body.tags) {
                if (!item || typeof item !== 'object') continue;
                const payload = item.payload || item;
                const rawName =
                  item.fileName ||
                  (typeof payload.name === 'string' ? payload.name : 'custom_tag');
                const targetFileName = reserveUniqueDiskFileName(rawName, usedTagTargets);
                const outContent =
                  typeof item.content === 'string'
                    ? item.content
                    : JSON.stringify({
                        ...payload,
                        _tavernsmithType: 'tag',
                      });

                fs.writeFileSync(path.join(tagsDir, targetFileName), outContent, 'utf8');
                writtenTagFiles.add(targetFileName.toLowerCase());
              }

              try {
                for (const fileName of fs.readdirSync(tagsDir)) {
                  if (!fileName.toLowerCase().endsWith('.json')) continue;
                  if (!writtenTagFiles.has(fileName.toLowerCase())) {
                    const orphanPath = path.join(tagsDir, fileName);
                    if (fs.existsSync(orphanPath)) fs.unlinkSync(orphanPath);
                  }
                }
              } catch {}
            }

            if (body.meta && typeof body.meta === 'object') {
              fs.writeFileSync(
                path.join(resolvedPath, META_FILENAME),
                JSON.stringify(body.meta, null, 2),
                'utf8'
              );
            }

            if (body.vault && typeof body.vault === 'object') {
              fs.writeFileSync(
                path.join(resolvedPath, VAULT_FILENAME),
                JSON.stringify(body.vault, null, 2),
                'utf8'
              );
            }

            return scanSavesDirectoryOnDisk(customSavePath);
          }

          function deleteFromSavesDirectoryOnDisk(body) {
            const customSavePath =
              typeof body.customSavePath === 'string'
                ? body.customSavePath
                : typeof body.savesDir === 'string'
                  ? body.savesDir
                  : undefined;
            const { charsDir, loreDir, themesDir, tagsDir } =
              resolveSavesRoot(customSavePath);

            const rawFolder = String(body.folder || body.kind || '').toLowerCase();
            const targetDir =
              rawFolder === 'lorebooks' || rawFolder === 'lorebook'
                ? loreDir
                : rawFolder === 'themes' || rawFolder === 'theme'
                  ? themesDir
                  : rawFolder === 'tags' || rawFolder === 'tag'
                    ? tagsDir
                    : charsDir;

            const candidateNames = new Set();
            const rawFileName =
              typeof body.fileName === 'string' ? body.fileName.trim() : '';
            const rawSavedFileName =
              typeof body.savedFileName === 'string' ? body.savedFileName.trim() : '';
            const rawName = typeof body.name === 'string' ? body.name.trim() : '';
            const rawId = typeof body.id === 'string' ? body.id.trim() : '';

            if (rawFileName) candidateNames.add(path.basename(rawFileName));
            if (rawSavedFileName) candidateNames.add(path.basename(rawSavedFileName));

            let deletedAny = false;
            for (const name of candidateNames) {
              const targetPath = path.join(targetDir, name);
              if (fs.existsSync(targetPath)) {
                try {
                  fs.unlinkSync(targetPath);
                  deletedAny = true;
                } catch {}
              }
            }

            if (rawId && fs.existsSync(targetDir)) {
              const entries = fs
                .readdirSync(targetDir, { withFileTypes: true })
                .filter((d) => d.isFile() && d.name.toLowerCase().endsWith('.json'));
              for (const entry of entries) {
                const fullPath = path.join(targetDir, entry.name);
                try {
                  const parsed = JSON.parse(fs.readFileSync(fullPath, 'utf8'));
                  if (extractEntityIdFromJson(parsed) === rawId) {
                    fs.unlinkSync(fullPath);
                    deletedAny = true;
                  }
                } catch {}
              }
            }

            if (!deletedAny && rawName) {
              const sanitizedTarget = path.join(targetDir, sanitizeDiskFileName(rawName));
              if (fs.existsSync(sanitizedTarget)) {
                try {
                  fs.unlinkSync(sanitizedTarget);
                } catch {}
              }
            }

            return scanSavesDirectoryOnDisk(customSavePath);
          }

          function readRequestBody(req) {
            return new Promise((resolve, reject) => {
              const chunks = [];
              req.on('data', (c) => chunks.push(Buffer.isBuffer(c) ? c : Buffer.from(c)));
              req.on('end', () => resolve(Buffer.concat(chunks).toString('utf8')));
              req.on('error', reject);
            });
          }

          function sendJson(res, status, payload) {
            const body = JSON.stringify(payload);
            res.statusCode = status;
            res.setHeader('Content-Type', 'application/json; charset=utf-8');
            res.setHeader('Cache-Control', 'no-store, no-cache, must-revalidate');
            res.end(body);
          }

          // Ensure ./Saves/, Characters/, Lorebooks/, Themes/, and Tags/ exist on startup
          resolveSavesRoot();

          const server = http.createServer(async (req, res) => {
            try {
              const parsedUrl = new URL(req.url || '/', `http://${HOST}:${PORT}`);
              const pathname = parsedUrl.pathname;

              if (req.method === 'GET' && pathname === '/api/disk/state') {
                const customPath =
                  parsedUrl.searchParams.get('customSavePath') ||
                  parsedUrl.searchParams.get('savesDir') ||
                  undefined;
                sendJson(res, 200, scanSavesDirectoryOnDisk(customPath));
                return;
              }

              if (req.method === 'POST' && pathname === '/api/disk/save') {
                const rawBody = await readRequestBody(req);
                const body = rawBody ? JSON.parse(rawBody) : {};
                sendJson(res, 200, saveToSavesDirectoryOnDisk(body));
                return;
              }

              if (req.method === 'POST' && pathname === '/api/disk/delete') {
                const rawBody = await readRequestBody(req);
                const body = rawBody ? JSON.parse(rawBody) : {};
                sendJson(res, 200, deleteFromSavesDirectoryOnDisk(body));
                return;
              }

              // Static file serving from dist/
              let relPath = decodeURIComponent(pathname === '/' ? '/index.html' : pathname);
              relPath = relPath.replace(/^\/+/, '');
              let fullStaticPath = path.resolve(ROOT_DIR, relPath);
              if (!fullStaticPath.startsWith(ROOT_DIR) || !fs.existsSync(fullStaticPath) || fs.statSync(fullStaticPath).isDirectory()) {
                fullStaticPath = path.join(ROOT_DIR, 'index.html');
              }

              const ext = path.extname(fullStaticPath).toLowerCase();
              res.statusCode = 200;
              res.setHeader('Content-Type', MIME_TYPES[ext] || 'application/octet-stream');
              res.setHeader('Cache-Control', 'no-store');
              fs.createReadStream(fullStaticPath).pipe(res);
            } catch (err) {
              sendJson(res, 500, { ok: false, error: err && err.message ? err.message : 'Server error' });
            }
          });

          server.listen(PORT, HOST, () => {
            console.log(`TavernSmith local disk server running at http://${HOST}:${PORT}`);
            console.log(`Direct disk storage active in: ${path.resolve(ROOT_DIR, 'Saves')}`);
          });
          EOF

          sed 's/^          //' << 'EOF' > dist/server.py
          #!/usr/bin/env python3
          from datetime import datetime, timezone
          import http.server
          import json
          import os
          import re
          import urllib.parse

          PORT = int(os.environ.get("PORT", "4173"))
          HOST = "127.0.0.1"
          ROOT_DIR = os.path.dirname(os.path.abspath(__file__))
          META_FILENAME = "_tavernsmith_meta.json"
          VAULT_FILENAME = "_tavernsmith_vault.enc"

          def sanitize_disk_file_name(raw):
              base = os.path.basename(str(raw or "untitled"))
              base = re.sub(r"\.json$", "", base, flags=re.IGNORECASE).strip()
              clean = re.sub(r"[^a-zA-Z0-9_-]+", "_", base).strip("_") or "untitled"
              return f"{clean}.json"

          def resolve_saves_root(custom_save_path=None):
              trimmed = (custom_save_path or "").strip()
              use_custom = bool(trimmed and trimmed not in ("./Saves", "./Saves/", "/Saves/"))
              if use_custom:
                  resolved_path = trimmed if os.path.isabs(trimmed) else os.path.abspath(os.path.join(ROOT_DIR, trimmed))
                  disk_root = trimmed
              else:
                  resolved_path = os.path.abspath(os.path.join(ROOT_DIR, "Saves"))
                  disk_root = "./Saves/"

              chars_dir = os.path.join(resolved_path, "Characters")
              lore_dir = os.path.join(resolved_path, "Lorebooks")
              themes_dir = os.path.join(resolved_path, "Themes")
              tags_dir = os.path.join(resolved_path, "Tags")

              os.makedirs(resolved_path, exist_ok=True)
              os.makedirs(chars_dir, exist_ok=True)
              os.makedirs(lore_dir, exist_ok=True)
              os.makedirs(themes_dir, exist_ok=True)
              os.makedirs(tags_dir, exist_ok=True)

              return {
                  "diskRoot": disk_root,
                  "resolvedPath": resolved_path,
                  "charsDir": chars_dir,
                  "loreDir": lore_dir,
                  "themesDir": themes_dir,
                  "tagsDir": tags_dir,
              }

          def extract_entity_id_from_json(parsed):
              if not isinstance(parsed, dict):
                  return ""
              source = parsed.get("payload") if isinstance(parsed.get("payload"), dict) else parsed
              if isinstance(source.get("id"), str) and source["id"].strip():
                  return source["id"].strip()
              data_obj = source.get("data")
              if isinstance(data_obj, dict):
                  if isinstance(data_obj.get("id"), str) and data_obj["id"].strip():
                      return data_obj["id"].strip()
                  ext_obj = data_obj.get("extensions")
                  if isinstance(ext_obj, dict):
                      ts_obj = ext_obj.get("tavernsmith")
                      if isinstance(ts_obj, dict) and isinstance(ts_obj.get("id"), str) and ts_obj["id"].strip():
                          return ts_obj["id"].strip()
              ext_obj = source.get("extensions")
              if isinstance(ext_obj, dict):
                  ts_obj = ext_obj.get("tavernsmith")
                  if isinstance(ts_obj, dict) and isinstance(ts_obj.get("id"), str) and ts_obj["id"].strip():
                      return ts_obj["id"].strip()
              return ""

          def reserve_unique_disk_file_name(preferred_name, used_names_lower):
              initial = sanitize_disk_file_name(preferred_name)
              stem = re.sub(r"\.json$", "", initial, flags=re.IGNORECASE)
              candidate = initial
              suffix = 2
              while candidate.lower() in used_names_lower:
                  candidate = f"{stem}_{suffix}.json"
                  suffix += 1
              used_names_lower.add(candidate.lower())
              return candidate

          def iso_from_mtime(mtime_ts):
              return datetime.fromtimestamp(mtime_ts, tz=timezone.utc).isoformat().replace("+00:00", "Z")

          def scan_saves_directory_on_disk(custom_save_path=None):
              dirs = resolve_saves_root(custom_save_path)
              characters = []
              lorebooks = []
              themes = []
              tags = []
              meta = None
              vault = None
              files = []

              if os.path.isdir(dirs["charsDir"]):
                  for name in sorted(os.listdir(dirs["charsDir"])):
                      if not name.lower().endswith(".json"):
                          continue
                      full_path = os.path.join(dirs["charsDir"], name)
                      if not os.path.isfile(full_path):
                          continue
                      try:
                          stat = os.stat(full_path)
                          with open(full_path, "r", encoding="utf-8") as f:
                              content = f.read()
                          parsed = json.loads(content)
                          if not isinstance(parsed, dict) or parsed.get("_tavernsmithType") == "lorebook":
                              continue
                          updated_iso = iso_from_mtime(stat.st_mtime)
                          obj = dict(parsed)
                          obj["_diskFileName"] = name
                          obj["_diskUpdatedAt"] = updated_iso
                          characters.append(obj)
                          files.append({
                              "id": f"Characters/{name}",
                              "folderPath": "Characters/",
                              "fileName": name,
                              "kind": "character",
                              "sizeBytes": stat.st_size,
                              "updatedAt": updated_iso,
                              "content": content,
                          })
                      except Exception:
                          pass

              if os.path.isdir(dirs["loreDir"]):
                  for name in sorted(os.listdir(dirs["loreDir"])):
                      if not name.lower().endswith(".json"):
                          continue
                      full_path = os.path.join(dirs["loreDir"], name)
                      if not os.path.isfile(full_path):
                          continue
                      try:
                          stat = os.stat(full_path)
                          with open(full_path, "r", encoding="utf-8") as f:
                              content = f.read()
                          parsed = json.loads(content)
                          if not isinstance(parsed, dict) or parsed.get("_tavernsmithType") == "character":
                              continue
                          updated_iso = iso_from_mtime(stat.st_mtime)
                          obj = dict(parsed)
                          obj["_tavernsmithType"] = "lorebook"
                          obj["_diskFileName"] = name
                          obj["_diskUpdatedAt"] = updated_iso
                          lorebooks.append(obj)
                          files.append({
                              "id": f"Lorebooks/{name}",
                              "folderPath": "Lorebooks/",
                              "fileName": name,
                              "kind": "lorebook",
                              "sizeBytes": stat.st_size,
                              "updatedAt": updated_iso,
                              "content": content,
                          })
                      except Exception:
                          pass

              if os.path.isdir(dirs["themesDir"]):
                  for name in sorted(os.listdir(dirs["themesDir"])):
                      if not name.lower().endswith(".json"):
                          continue
                      full_path = os.path.join(dirs["themesDir"], name)
                      if not os.path.isfile(full_path):
                          continue
                      try:
                          stat = os.stat(full_path)
                          with open(full_path, "r", encoding="utf-8") as f:
                              content = f.read()
                          parsed = json.loads(content)
                          if isinstance(parsed, dict):
                              updated_iso = iso_from_mtime(stat.st_mtime)
                              obj = dict(parsed)
                              obj["_tavernsmithType"] = "theme"
                              obj["_diskFileName"] = name
                              obj["_diskUpdatedAt"] = updated_iso
                              themes.append(obj)
                              files.append({
                                  "id": f"Themes/{name}",
                                  "folderPath": "Themes/",
                                  "fileName": name,
                                  "kind": "theme",
                                  "sizeBytes": stat.st_size,
                                  "updatedAt": updated_iso,
                                  "content": content,
                              })
                      except Exception:
                          pass

              if os.path.isdir(dirs["tagsDir"]):
                  for name in sorted(os.listdir(dirs["tagsDir"])):
                      if not name.lower().endswith(".json"):
                          continue
                      full_path = os.path.join(dirs["tagsDir"], name)
                      if not os.path.isfile(full_path):
                          continue
                      try:
                          stat = os.stat(full_path)
                          with open(full_path, "r", encoding="utf-8") as f:
                              content = f.read()
                          parsed = json.loads(content)
                          if isinstance(parsed, dict):
                              updated_iso = iso_from_mtime(stat.st_mtime)
                              obj = dict(parsed)
                              obj["_tavernsmithType"] = "tag"
                              obj["_diskFileName"] = name
                              obj["_diskUpdatedAt"] = updated_iso
                              tags.append(obj)
                              files.append({
                                  "id": f"Tags/{name}",
                                  "folderPath": "Tags/",
                                  "fileName": name,
                                  "kind": "tag",
                                  "sizeBytes": stat.st_size,
                                  "updatedAt": updated_iso,
                                  "content": content,
                              })
                      except Exception:
                          pass

              meta_path = os.path.join(dirs["resolvedPath"], META_FILENAME)
              if os.path.isfile(meta_path):
                  try:
                      stat = os.stat(meta_path)
                      with open(meta_path, "r", encoding="utf-8") as f:
                          content = f.read()
                      meta = json.loads(content)
                      files.append({
                          "id": f"/{META_FILENAME}",
                          "folderPath": "/",
                          "fileName": META_FILENAME,
                          "kind": "meta",
                          "sizeBytes": stat.st_size,
                          "updatedAt": iso_from_mtime(stat.st_mtime),
                          "content": content,
                      })
                  except Exception:
                      meta = None

              vault_path = os.path.join(dirs["resolvedPath"], VAULT_FILENAME)
              if os.path.isfile(vault_path):
                  try:
                      stat = os.stat(vault_path)
                      with open(vault_path, "r", encoding="utf-8") as f:
                          content = f.read()
                      vault = json.loads(content)
                      files.append({
                          "id": f"/{VAULT_FILENAME}",
                          "folderPath": "/",
                          "fileName": VAULT_FILENAME,
                          "kind": "vault",
                          "sizeBytes": stat.st_size,
                          "updatedAt": iso_from_mtime(stat.st_mtime),
                          "content": content,
                      })
                  except Exception:
                      vault = None

              return {
                  "ok": True,
                  "diskRoot": dirs["diskRoot"],
                  "resolvedPath": dirs["resolvedPath"],
                  "characters": characters,
                  "lorebooks": lorebooks,
                  "themes": themes,
                  "tags": tags,
                  "meta": meta,
                  "vault": vault,
                  "files": files,
                  "updatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              }

          def save_to_saves_directory_on_disk(body):
              custom_save_path = body.get("customSavePath") or body.get("savesDir")
              dirs = resolve_saves_root(custom_save_path)

              if isinstance(body.get("characters"), list):
                  used_char_targets = set()
                  written_char_files = set()
                  for item in body["characters"]:
                      if not isinstance(item, dict):
                          continue
                      payload = item.get("payload") if isinstance(item.get("payload"), dict) else item
                      if payload.get("_tavernsmithType") == "lorebook":
                          continue
                      data_node = payload.get("data") if isinstance(payload.get("data"), dict) else {}
                      raw_name = item.get("fileName") or data_node.get("name") or payload.get("name") or "untitled"
                      target_file = reserve_unique_disk_file_name(raw_name, used_char_targets)
                      if isinstance(item.get("content"), str):
                          out_content = item["content"]
                      else:
                          out_obj = dict(payload)
                          out_obj["_tavernsmithType"] = "character"
                          out_content = json.dumps(out_obj, indent=2)
                      with open(os.path.join(dirs["charsDir"], target_file), "w", encoding="utf-8") as f:
                          f.write(out_content)
                      written_char_files.add(target_file.lower())
                  try:
                      for file_name in os.listdir(dirs["charsDir"]):
                          if not file_name.lower().endswith(".json"):
                              continue
                          if file_name.lower() not in written_char_files:
                              orphan_path = os.path.join(dirs["charsDir"], file_name)
                              if os.path.isfile(orphan_path):
                                  os.unlink(orphan_path)
                  except Exception:
                      pass

              if isinstance(body.get("lorebooks"), list):
                  used_lore_targets = set()
                  written_book_files = set()
                  for item in body["lorebooks"]:
                      if not isinstance(item, dict):
                          continue
                      payload = item.get("payload") if isinstance(item.get("payload"), dict) else item
                      if payload.get("_tavernsmithType") == "character":
                          continue
                      raw_name = item.get("fileName") or payload.get("name") or "untitled_lorebook"
                      target_file = reserve_unique_disk_file_name(raw_name, used_lore_targets)
                      if isinstance(item.get("content"), str):
                          out_content = item["content"]
                      else:
                          out_obj = dict(payload)
                          out_obj["_tavernsmithType"] = "lorebook"
                          out_content = json.dumps(out_obj, indent=2)
                      with open(os.path.join(dirs["loreDir"], target_file), "w", encoding="utf-8") as f:
                          f.write(out_content)
                      written_book_files.add(target_file.lower())
                  try:
                      for file_name in os.listdir(dirs["loreDir"]):
                          if not file_name.lower().endswith(".json"):
                              continue
                          if file_name.lower() not in written_book_files:
                              orphan_path = os.path.join(dirs["loreDir"], file_name)
                              if os.path.isfile(orphan_path):
                                  os.unlink(orphan_path)
                  except Exception:
                      pass

              if isinstance(body.get("themes"), list):
                  used_theme_targets = set()
                  written_theme_files = set()
                  for item in body["themes"]:
                      if not isinstance(item, dict):
                          continue
                      payload = item.get("payload") if isinstance(item.get("payload"), dict) else item
                      raw_name = item.get("fileName") or payload.get("name") or "custom_theme"
                      target_file = reserve_unique_disk_file_name(raw_name, used_theme_targets)
                      if isinstance(item.get("content"), str):
                          out_content = item["content"]
                      else:
                          out_obj = dict(payload)
                          out_obj["_tavernsmithType"] = "theme"
                          out_content = json.dumps(out_obj)
                      with open(os.path.join(dirs["themesDir"], target_file), "w", encoding="utf-8") as f:
                          f.write(out_content)
                      written_theme_files.add(target_file.lower())
                  try:
                      for file_name in os.listdir(dirs["themesDir"]):
                          if not file_name.lower().endswith(".json"):
                              continue
                          if file_name.lower() not in written_theme_files:
                              orphan_path = os.path.join(dirs["themesDir"], file_name)
                              if os.path.isfile(orphan_path):
                                  os.unlink(orphan_path)
                  except Exception:
                      pass

              if isinstance(body.get("tags"), list):
                  used_tag_targets = set()
                  written_tag_files = set()
                  for item in body["tags"]:
                      if not isinstance(item, dict):
                          continue
                      payload = item.get("payload") if isinstance(item.get("payload"), dict) else item
                      raw_name = item.get("fileName") or payload.get("name") or "custom_tag"
                      target_file = reserve_unique_disk_file_name(raw_name, used_tag_targets)
                      if isinstance(item.get("content"), str):
                          out_content = item["content"]
                      else:
                          out_obj = dict(payload)
                          out_obj["_tavernsmithType"] = "tag"
                          out_content = json.dumps(out_obj)
                      with open(os.path.join(dirs["tagsDir"], target_file), "w", encoding="utf-8") as f:
                          f.write(out_content)
                      written_tag_files.add(target_file.lower())
                  try:
                      for file_name in os.listdir(dirs["tagsDir"]):
                          if not file_name.lower().endswith(".json"):
                              continue
                          if file_name.lower() not in written_tag_files:
                              orphan_path = os.path.join(dirs["tagsDir"], file_name)
                              if os.path.isfile(orphan_path):
                                  os.unlink(orphan_path)
                  except Exception:
                      pass

              if isinstance(body.get("meta"), dict):
                  with open(os.path.join(dirs["resolvedPath"], META_FILENAME), "w", encoding="utf-8") as f:
                      f.write(json.dumps(body["meta"], indent=2))

              if isinstance(body.get("vault"), dict):
                  with open(os.path.join(dirs["resolvedPath"], VAULT_FILENAME), "w", encoding="utf-8") as f:
                      f.write(json.dumps(body["vault"], indent=2))

              return scan_saves_directory_on_disk(custom_save_path)

          def delete_from_saves_directory_on_disk(body):
              custom_save_path = body.get("customSavePath") or body.get("savesDir")
              dirs = resolve_saves_root(custom_save_path)

              raw_folder = str(body.get("folder") or body.get("kind") or "").lower()
              if raw_folder in ("lorebooks", "lorebook"):
                  target_dir = dirs["loreDir"]
              elif raw_folder in ("themes", "theme"):
                  target_dir = dirs["themesDir"]
              elif raw_folder in ("tags", "tag"):
                  target_dir = dirs["tagsDir"]
              else:
                  target_dir = dirs["charsDir"]

              candidate_names = set()
              raw_file_name = body.get("fileName").strip() if isinstance(body.get("fileName"), str) else ""
              raw_saved_file_name = body.get("savedFileName").strip() if isinstance(body.get("savedFileName"), str) else ""
              raw_name = body.get("name").strip() if isinstance(body.get("name"), str) else ""
              raw_id = body.get("id").strip() if isinstance(body.get("id"), str) else ""

              if raw_file_name:
                  candidate_names.add(os.path.basename(raw_file_name))
              if raw_saved_file_name:
                  candidate_names.add(os.path.basename(raw_saved_file_name))

              deleted_any = False
              for name in candidate_names:
                  target_path = os.path.join(target_dir, name)
                  if os.path.isfile(target_path):
                      try:
                          os.unlink(target_path)
                          deleted_any = True
                      except Exception:
                          pass

              if raw_id and os.path.isdir(target_dir):
                  for entry_name in os.listdir(target_dir):
                      if not entry_name.lower().endswith(".json"):
                          continue
                      full_path = os.path.join(target_dir, entry_name)
                      if not os.path.isfile(full_path):
                          continue
                      try:
                          with open(full_path, "r", encoding="utf-8") as f:
                              parsed = json.load(f)
                          if extract_entity_id_from_json(parsed) == raw_id:
                              os.unlink(full_path)
                              deleted_any = True
                      except Exception:
                          pass

              if not deleted_any and raw_name:
                  sanitized_target = os.path.join(target_dir, sanitize_disk_file_name(raw_name))
                  if os.path.isfile(sanitized_target):
                      try:
                          os.unlink(sanitized_target)
                      except Exception:
                          pass

              return scan_saves_directory_on_disk(custom_save_path)

          resolve_saves_root()

          class TavernSmithHandler(http.server.SimpleHTTPRequestHandler):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, directory=ROOT_DIR, **kwargs)

              def end_headers(self):
                  self.send_header("Cache-Control", "no-store, no-cache, must-revalidate")
                  super().end_headers()

              def send_json(self, status, payload):
                  body = json.dumps(payload).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  parsed_url = urllib.parse.urlparse(self.path)
                  if parsed_url.path == "/api/disk/state":
                      qs = urllib.parse.parse_qs(parsed_url.query)
                      custom_path = (qs.get("customSavePath") or qs.get("savesDir") or [None])[0]
                      self.send_json(200, scan_saves_directory_on_disk(custom_path))
                      return
                  return super().do_GET()

              def do_POST(self):
                  parsed_url = urllib.parse.urlparse(self.path)
                  length = int(self.headers.get("Content-Length", "0"))
                  raw_body = self.rfile.read(length).decode("utf-8") if length > 0 else "{}"
                  body = json.loads(raw_body or "{}")

                  if parsed_url.path == "/api/disk/save":
                      self.send_json(200, save_to_saves_directory_on_disk(body))
                      return

                  if parsed_url.path == "/api/disk/delete":
                      self.send_json(200, delete_from_saves_directory_on_disk(body))
                      return

                  self.send_json(404, {"ok": False, "error": "Not found"})

          if __name__ == "__main__":
              print(f"TavernSmith local disk server running at http://{HOST}:{PORT}")
              print(f"Direct disk storage active in: {os.path.abspath(os.path.join(ROOT_DIR, 'Saves'))}")
              with http.server.ThreadingHTTPServer((HOST, PORT), TavernSmithHandler) as httpd:
                  httpd.serve_forever()
          EOF

          chmod +x dist/server.cjs dist/server.py

          sed 's/^          //' << 'EOF' > dist/Launch-TavernSmith-Windows.bat
          @echo off
          cd /d "%~dp0"
          setlocal
          title TavernSmith Standalone Launcher (Direct ./Saves/ Disk Mode)
          set PORT=4173
          set URL=http://127.0.0.1:%PORT%/?nocache=%RANDOM%

          if not exist "Saves\Characters" mkdir "Saves\Characters"
          if not exist "Saves\Lorebooks" mkdir "Saves\Lorebooks"
          if not exist "Saves\Themes" mkdir "Saves\Themes"
          if not exist "Saves\Tags" mkdir "Saves\Tags"

          echo ===================================================
          echo   TavernSmith - SillyTavern V2/V3 Character IDE
          echo   Direct Local Disk Storage: .\Saves\
          echo ===================================================
          echo.

          where node >nul 2>nul
          if %ERRORLEVEL% EQU 0 (
            echo Starting TavernSmith Local Disk Server via Node.js on %URL% ...
            start "" msedge --app="%URL%" 2>nul || start "" chrome --app="%URL%" 2>nul || start "" "%URL%"
            node server.cjs
            goto :eof
          )

          where python >nul 2>nul
          if %ERRORLEVEL% EQU 0 (
            echo Starting TavernSmith Local Disk Server via Python on %URL% ...
            start "" msedge --app="%URL%" 2>nul || start "" chrome --app="%URL%" 2>nul || start "" "%URL%"
            python server.py
            goto :eof
          )

          where py >nul 2>nul
          if %ERRORLEVEL% EQU 0 (
            echo Starting TavernSmith Local Disk Server via Python Launcher on %URL% ...
            start "" msedge --app="%URL%" 2>nul || start "" chrome --app="%URL%" 2>nul || start "" "%URL%"
            py -3 server.py
            goto :eof
          )

          echo ERROR: Please install Node.js (https://nodejs.org) or Python 3 (https://python.org) to run the local ./Saves/ disk server.
          pause
          EOF

          sed 's/^          //' << 'EOF' > dist/Launch-TavernSmith-Mac-Linux.command
          #!/usr/bin/env bash
          cd "$(dirname "$0")" || exit 1
          PORT=4173
          URL="http://127.0.0.1:${PORT}/?nocache=$(date +%s)"

          mkdir -p "./Saves/Characters" "./Saves/Lorebooks" "./Saves/Themes" "./Saves/Tags"

          echo "==================================================="
          echo "  TavernSmith — SillyTavern V2/V3 Character IDE"
          echo "  Direct Local Disk Storage: ./Saves/"
          echo "==================================================="

          open_url() {
            if [[ "$OSTYPE" == "darwin"* ]]; then
              open "$1"
            elif command -v xdg-open >/dev/null 2>&1; then
              xdg-open "$1" >/dev/null 2>&1 &
            fi
          }

          if command -v node >/dev/null 2>&1; then
            echo "Starting TavernSmith Local Disk Server via Node on ${URL} (Press Ctrl+C to stop)..."
            (sleep 1 && open_url "${URL}") &
            node ./server.cjs
          elif command -v python3 >/dev/null 2>&1; then
            echo "Starting TavernSmith Local Disk Server via Python 3 on ${URL} (Press Ctrl+C to stop)..."
            (sleep 1 && open_url "${URL}") &
            python3 ./server.py
          elif command -v python >/dev/null 2>&1; then
            echo "Starting TavernSmith Local Disk Server via Python on ${URL} (Press Ctrl+C to stop)..."
            (sleep 1 && open_url "${URL}") &
            python ./server.py
          else
            echo "ERROR: Please install Node.js or Python 3 to run the local ./Saves/ disk server."
          fi
          EOF

          chmod +x dist/Launch-TavernSmith-Mac-Linux.command

          sed 's/^          //' << 'EOF' > dist/README-PORTABLE.txt
          TavernSmith — Portable Ready-to-Run Application
          ===============================================
          100% of your Characters, Lorebooks, Custom Tags, Context Themes, Settings, and
          AES-256-GCM Encrypted API Keys are stored directly on disk in `./Saves/`:
            - ./Saves/Characters/
            - ./Saves/Lorebooks/
            - ./Saves/Themes/
            - ./Saves/Tags/
            - ./Saves/_tavernsmith_meta.json
            - ./Saves/_tavernsmith_vault.enc

          1. WINDOWS:
             Double-click "Launch-TavernSmith-Windows.bat" (No Administrator privileges required).

          2. macOS (Intel & Apple Silicon ARM) / LINUX:
             Double-click "Launch-TavernSmith-Mac-Linux.command"
             (or run `./Launch-TavernSmith-Mac-Linux.command` in Terminal).
          EOF

      - name: Package ONLY Compiled Production App (dist/) into TavernSmith-App-Portable.zip
        run: |
          cd dist && zip -r ../TavernSmith-App-Portable.zip .

      - name: Extract Latest Release Notes & Publish GitHub Release via GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const pkg = require('./package.json');
          const changelog = fs.existsSync('CHANGELOG.md')
            ? fs.readFileSync('CHANGELOG.md', 'utf8')
            : '';

          const downloadCallout = "> 📦 **Download Ready-to-Run App:** Click **TavernSmith-App-Portable.zip** below under Assets to download the standalone compiled application (do not download the 'Source code' archives).\n\n";

          let notes = '';
          const sections = changelog.split(/\n(?=## \[)/);
          const firstReleaseSection = sections.find((s) => s.trim().startsWith('## ['));
          if (firstReleaseSection) {
            notes = firstReleaseSection.trim();
          } else {
            notes = `## TavernSmith v${pkg.version}\n\nUniversal Portable Release for Windows, macOS (x64 & Apple Silicon ARM), and Linux with direct ./Saves/ local disk persistence.`;
          }

          fs.writeFileSync('RELEASE_NOTES.md', downloadCallout + notes + '\n', 'utf8');
          EOF

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi

          echo "Publishing GitHub Release for tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" TavernSmith-App-Portable.zip --clobber
            gh release edit "$TAG" --title "TavernSmith $TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" TavernSmith-App-Portable.zip --title "TavernSmith $TAG" --notes-file RELEASE_NOTES.md
          fi
