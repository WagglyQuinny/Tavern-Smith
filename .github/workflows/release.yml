name: Standalone Release Push & Portable Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    name: Build Standalone Portable App & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 24 (Native Action, No Lockfile Cache)
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript Verification
        run: npm run lint

      - name: Build Production Standalone Bundle & Strip crossorigin for Direct file:// Support
        run: |
          npm run build
          node -e '
            const fs = require("fs");
            const indexPath = "dist/index.html";
            if (fs.existsSync(indexPath)) {
              let html = fs.readFileSync(indexPath, "utf8");
              html = html.replace(/\s+crossorigin(?:="[^"]*")?/gi, "");
              fs.writeFileSync(indexPath, html, "utf8");
              console.log("Stripped crossorigin attributes from dist/index.html.");
            }
          '

      - name: Generate Zero-Dependency Local Disk Servers (server.cjs + server.py) & Launchers Inside dist/
        run: |
          cat << 'EOF' > dist/server.cjs
          #!/usr/bin/env node
          const crypto = require('crypto');
          const http = require('http');
          const fs = require('fs');
          const path = require('path');

          const PORT = Number(process.env.PORT || 4173);
          const HOST = '127.0.0.1';
          const ROOT_DIR = __dirname;
          const META_FILENAME = '_tavernsmith_meta.json';
          const LEGACY_VAULT_FILENAME = '_tavernsmith_vault.enc';
          const APP_VAULT_DIRNAME = '.tavernsmith-app';
          const APP_VAULT_FILENAME = 'credentials.vault.enc';
          const APP_VAULT_KEY_FILENAME = 'vault.key';

          const MAX_BODY_BYTES = 128 * 1024 * 1024;
          const MIME_TYPES = {
            '.html': 'text/html; charset=utf-8',
            '.js': 'application/javascript; charset=utf-8',
            '.mjs': 'application/javascript; charset=utf-8',
            '.css': 'text/css; charset=utf-8',
            '.json': 'application/json; charset=utf-8',
            '.svg': 'image/svg+xml',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.jpeg': 'image/jpeg',
            '.webp': 'image/webp',
            '.ico': 'image/x-icon',
          };

          function sanitizeDiskFileName(raw) {
            const base = path.basename(String(raw || 'untitled')).replace(/\.json$/i, '');
            const clean =
              base
                .trim()
                .replace(/[^a-zA-Z0-9_-]+/g, '_')
                .replace(/^_+|_+$/g, '') || 'untitled';
            return `${clean}.json`;
          }

          function getCanonicalWorkspaceRoot() {
            try {
              return fs.realpathSync(ROOT_DIR);
            } catch {
              return path.resolve(ROOT_DIR);
            }
          }

          function isFileConfinedInDir(dirPath, candidatePath) {
            try {
              const realDir = fs.realpathSync(dirPath);
              const realCandidate = fs.realpathSync(candidatePath);
              const rel = path.relative(realDir, realCandidate);
              return rel !== '' && !rel.startsWith('..') && !path.isAbsolute(rel);
            } catch {
              return false;
            }
          }

          function isLocalHostname(hostname) {
            const clean = String(hostname || '')
              .trim()
              .toLowerCase()
              .replace(/^\[|\]$/g, '');
            return clean === 'localhost' || clean === '127.0.0.1' || clean === '::1';
          }

          function isLocalHostHeader(hostHeader) {
            if (!hostHeader || typeof hostHeader !== 'string') return false;
            try {
              const parsed = new URL(`http://${hostHeader.trim()}`);
              return isLocalHostname(parsed.hostname);
            } catch {
              return false;
            }
          }

          function validateLocalApiRequest(req, requireJsonContentType) {
            const hostHeader = req.headers.host;
            if (!isLocalHostHeader(hostHeader)) {
              return {
                ok: false,
                status: 403,
                error: 'Blocked request with non-local Host header.',
              };
            }

            const secFetchSite = String(req.headers['sec-fetch-site'] || '')
              .trim()
              .toLowerCase();
            if (secFetchSite && secFetchSite !== 'same-origin' && secFetchSite !== 'none') {
              return {
                ok: false,
                status: 403,
                error: 'Blocked cross-site request to local TavernSmith API.',
              };
            }

            const originHeader = req.headers.origin;
            if (typeof originHeader === 'string' && originHeader.trim()) {
              try {
                const originUrl = new URL(originHeader.trim());
                if (
                  (originUrl.protocol !== 'http:' && originUrl.protocol !== 'https:') ||
                  !isLocalHostname(originUrl.hostname) ||
                  originUrl.host.toLowerCase() !== String(hostHeader).trim().toLowerCase()
                ) {
                  return {
                    ok: false,
                    status: 403,
                    error: 'Blocked cross-origin request to local TavernSmith API.',
                  };
                }
              } catch {
                return {
                  ok: false,
                  status: 403,
                  error: 'Blocked request with malformed Origin header.',
                };
              }
            }

            if (requireJsonContentType) {
              const contentType = String(req.headers['content-type'] || '')
                .trim()
                .toLowerCase();
              if (!contentType.startsWith('application/json')) {
                return {
                  ok: false,
                  status: 415,
                  error: 'POST requests to local APIs must use Content-Type: application/json.',
                };
              }
            }

            return { ok: true };
          }

          function resolveSavesRoot() {
            const workspaceRoot = getCanonicalWorkspaceRoot();
            const resolvedPath = path.join(workspaceRoot, 'Saves');
            const diskRoot = './Saves/';

            const charsDir = path.join(resolvedPath, 'Characters');
            const loreDir = path.join(resolvedPath, 'Lorebooks');
            const themesDir = path.join(resolvedPath, 'Themes');
            const tagsDir = path.join(resolvedPath, 'Tags');

            fs.mkdirSync(resolvedPath, { recursive: true });
            fs.mkdirSync(charsDir, { recursive: true });
            fs.mkdirSync(loreDir, { recursive: true });
            fs.mkdirSync(themesDir, { recursive: true });
            fs.mkdirSync(tagsDir, { recursive: true });

            return { diskRoot, resolvedPath, charsDir, loreDir, themesDir, tagsDir };
          }

          function resolveAppVaultPaths() {
            const workspaceRoot = getCanonicalWorkspaceRoot();
            const appVaultDir = path.join(workspaceRoot, APP_VAULT_DIRNAME);
            fs.mkdirSync(appVaultDir, { recursive: true, mode: 0o700 });
            return {
              appVaultDir,
              vaultFilePath: path.join(appVaultDir, APP_VAULT_FILENAME),
              keyFilePath: path.join(appVaultDir, APP_VAULT_KEY_FILENAME),
              legacyVaultPath: path.join(workspaceRoot, 'Saves', LEGACY_VAULT_FILENAME),
            };
          }

          function readOrCreateAppVaultKey(keyFilePath) {
            try {
              if (fs.existsSync(keyFilePath)) {
                const existing = fs.readFileSync(keyFilePath, 'utf8').trim();
                if (existing.length >= 32) {
                  return existing;
                }
              }
            } catch {}
            const generated = crypto.randomBytes(32).toString('base64');
            fs.writeFileSync(keyFilePath, `${generated}\n`, {
              encoding: 'utf8',
              mode: 0o600,
            });
            try {
              fs.chmodSync(keyFilePath, 0o600);
            } catch {}
            return generated;
          }

          function inspectDiskJsonFile(fullPath) {
            let sizeBytes = 0;
            let updatedAt = new Date().toISOString();
            let content = '';
            try {
              const stat = fs.statSync(fullPath);
              sizeBytes = stat.size;
              updatedAt = stat.mtime.toISOString();
              content = fs.readFileSync(fullPath, 'utf8');
            } catch (err) {
              return {
                ok: false,
                reason: err && err.message ? err.message : 'Unreadable file',
                content: '',
                sizeBytes,
                updatedAt,
              };
            }

            if (!content.trim()) {
              return {
                ok: false,
                reason: 'File is empty (0 bytes or whitespace only)',
                content,
                sizeBytes,
                updatedAt,
              };
            }

            try {
              const parsed = JSON.parse(content);
              if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
                return {
                  ok: false,
                  reason: 'JSON root must be an object',
                  content: content.slice(0, 16384),
                  sizeBytes,
                  updatedAt,
                };
              }
              return {
                ok: true,
                parsed,
                content,
                sizeBytes,
                updatedAt,
              };
            } catch (err) {
              return {
                ok: false,
                reason: err && err.message ? err.message : 'Malformed JSON syntax',
                content: content.slice(0, 16384),
                sizeBytes,
                updatedAt,
              };
            }
          }

          function readAppVaultStateOnDisk() {
            const { vaultFilePath, keyFilePath, legacyVaultPath } = resolveAppVaultPaths();
            const appKey = readOrCreateAppVaultKey(keyFilePath);
            let vault = null;
            let legacyVault = null;

            if (fs.existsSync(vaultFilePath)) {
              const inspected = inspectDiskJsonFile(vaultFilePath);
              if (inspected.ok) {
                vault = inspected.parsed;
              }
            }

            if (!vault && fs.existsSync(legacyVaultPath)) {
              const inspectedLegacy = inspectDiskJsonFile(legacyVaultPath);
              if (inspectedLegacy.ok) {
                legacyVault = inspectedLegacy.parsed;
              }
            }

            return {
              ok: true,
              storagePath: `./${APP_VAULT_DIRNAME}/`,
              appKey,
              vault,
              legacyVault,
            };
          }

          function saveAppVaultStateOnDisk(body) {
            const { vaultFilePath, keyFilePath, legacyVaultPath } = resolveAppVaultPaths();
            readOrCreateAppVaultKey(keyFilePath);

            if (body && body.vault && typeof body.vault === 'object' && !Array.isArray(body.vault)) {
              fs.writeFileSync(vaultFilePath, JSON.stringify(body.vault, null, 2), {
                encoding: 'utf8',
                mode: 0o600,
              });
              try {
                fs.chmodSync(vaultFilePath, 0o600);
              } catch {}
            }

            if (body && body.removeLegacy === true && fs.existsSync(legacyVaultPath)) {
              try {
                fs.unlinkSync(legacyVaultPath);
              } catch {}
            }

            return {
              ok: true,
              storagePath: `./${APP_VAULT_DIRNAME}/`,
              saved: true,
            };
          }

          function pruneValidOrphanJsonFiles(targetDir, writtenFilesLower) {
            try {
              for (const fileName of fs.readdirSync(targetDir)) {
                if (!fileName.toLowerCase().endsWith('.json')) continue;
                if (!writtenFilesLower.has(fileName.toLowerCase())) {
                  const orphanPath = path.join(targetDir, fileName);
                  if (fs.existsSync(orphanPath) && isFileConfinedInDir(targetDir, orphanPath)) {
                    const inspected = inspectDiskJsonFile(orphanPath);
                    if (inspected.ok) {
                      fs.unlinkSync(orphanPath);
                    }
                  }
                }
              }
            } catch {}
          }

          function extractEntityIdFromJson(parsed) {
            if (!parsed || typeof parsed !== 'object') return '';
            const source =
              parsed.payload && typeof parsed.payload === 'object' && !Array.isArray(parsed.payload)
                ? parsed.payload
                : parsed;
            if (typeof source.id === 'string' && source.id.trim()) {
              return source.id.trim();
            }
            if (source.data && typeof source.data === 'object') {
              if (typeof source.data.id === 'string' && source.data.id.trim()) {
                return source.data.id.trim();
              }
              if (
                source.data.extensions &&
                typeof source.data.extensions === 'object' &&
                source.data.extensions.tavernsmith &&
                typeof source.data.extensions.tavernsmith === 'object' &&
                typeof source.data.extensions.tavernsmith.id === 'string' &&
                source.data.extensions.tavernsmith.id.trim()
              ) {
                return source.data.extensions.tavernsmith.id.trim();
              }
            }
            if (
              source.extensions &&
              typeof source.extensions === 'object' &&
              source.extensions.tavernsmith &&
              typeof source.extensions.tavernsmith === 'object' &&
              typeof source.extensions.tavernsmith.id === 'string' &&
              source.extensions.tavernsmith.id.trim()
            ) {
              return source.extensions.tavernsmith.id.trim();
            }
            return '';
          }

          function reserveUniqueDiskFileName(preferredName, usedNamesLower) {
            const initial = sanitizeDiskFileName(preferredName);
            const stem = initial.replace(/\.json$/i, '');
            let candidate = initial;
            let suffix = 2;
            while (usedNamesLower.has(candidate.toLowerCase())) {
              candidate = `${stem}_${suffix}.json`;
              suffix++;
            }
            usedNamesLower.add(candidate.toLowerCase());
            return candidate;
          }

          function scanSavesDirectoryOnDisk() {
            const { diskRoot, resolvedPath, charsDir, loreDir, themesDir, tagsDir } =
              resolveSavesRoot();

            const characters = [];
            const lorebooks = [];
            const themes = [];
            const tags = [];
            let meta = null;
            const files = [];

            if (fs.existsSync(charsDir)) {
              const charEntries = fs
                .readdirSync(charsDir, { withFileTypes: true })
                .filter((d) => d.isFile() && d.name.toLowerCase().endsWith('.json'))
                .sort((a, b) => a.name.localeCompare(b.name));

              for (const entry of charEntries) {
                const fullPath = path.join(charsDir, entry.name);
                if (!isFileConfinedInDir(charsDir, fullPath)) continue;
                const inspected = inspectDiskJsonFile(fullPath);
                if (!inspected.ok) {
                  files.push({
                    id: `Characters/${entry.name}`,
                    folderPath: 'Characters/',
                    fileName: entry.name,
                    kind: 'character',
                    sizeBytes: inspected.sizeBytes,
                    updatedAt: inspected.updatedAt,
                    content: inspected.content,
                    isCorrupted: true,
                    corruptReason: inspected.reason,
                  });
                  continue;
                }
                if (inspected.parsed._tavernsmithType === 'lorebook') continue;
                characters.push({
                  ...inspected.parsed,
                  _diskFileName: entry.name,
                  _diskUpdatedAt: inspected.updatedAt,
                });
                files.push({
                  id: `Characters/${entry.name}`,
                  folderPath: 'Characters/',
                  fileName: entry.name,
                  kind: 'character',
                  sizeBytes: inspected.sizeBytes,
                  updatedAt: inspected.updatedAt,
                  content: inspected.content,
                });
              }
            }

            if (fs.existsSync(loreDir)) {
              const loreEntries = fs
                .readdirSync(loreDir, { withFileTypes: true })
                .filter((d) => d.isFile() && d.name.toLowerCase().endsWith('.json'))
                .sort((a, b) => a.name.localeCompare(b.name));

              for (const entry of loreEntries) {
                const fullPath = path.join(loreDir, entry.name);
                if (!isFileConfinedInDir(loreDir, fullPath)) continue;
                const inspected = inspectDiskJsonFile(fullPath);
                if (!inspected.ok) {
                  files.push({
                    id: `Lorebooks/${entry.name}`,
                    folderPath: 'Lorebooks/',
                    fileName: entry.name,
                    kind: 'lorebook',
                    sizeBytes: inspected.sizeBytes,
                    updatedAt: inspected.updatedAt,
                    content: inspected.content,
                    isCorrupted: true,
                    corruptReason: inspected.reason,
                  });
                  continue;
                }
                if (inspected.parsed._tavernsmithType === 'character') continue;
                lorebooks.push({
                  ...inspected.parsed,
                  _tavernsmithType: 'lorebook',
                  _diskFileName: entry.name,
                  _diskUpdatedAt: inspected.updatedAt,
                });
                files.push({
                  id: `Lorebooks/${entry.name}`,
                  folderPath: 'Lorebooks/',
                  fileName: entry.name,
                  kind: 'lorebook',
                  sizeBytes: inspected.sizeBytes,
                  updatedAt: inspected.updatedAt,
                  content: inspected.content,
                });
              }
            }

            if (fs.existsSync(themesDir)) {
              const themeEntries = fs
                .readdirSync(themesDir, { withFileTypes: true })
                .filter((d) => d.isFile() && d.name.toLowerCase().endsWith('.json'))
                .sort((a, b) => a.name.localeCompare(b.name));

              for (const entry of themeEntries) {
                const fullPath = path.join(themesDir, entry.name);
                if (!isFileConfinedInDir(themesDir, fullPath)) continue;
                const inspected = inspectDiskJsonFile(fullPath);
                if (!inspected.ok) {
                  files.push({
                    id: `Themes/${entry.name}`,
                    folderPath: 'Themes/',
                    fileName: entry.name,
                    kind: 'theme',
                    sizeBytes: inspected.sizeBytes,
                    updatedAt: inspected.updatedAt,
                    content: inspected.content,
                    isCorrupted: true,
                    corruptReason: inspected.reason,
                  });
                  continue;
                }
                themes.push({
                  ...inspected.parsed,
                  _tavernsmithType: 'theme',
                  _diskFileName: entry.name,
                  _diskUpdatedAt: inspected.updatedAt,
                });
                files.push({
                  id: `Themes/${entry.name}`,
                  folderPath: 'Themes/',
                  fileName: entry.name,
                  kind: 'theme',
                  sizeBytes: inspected.sizeBytes,
                  updatedAt: inspected.updatedAt,
                  content: inspected.content,
                });
              }
            }

            if (fs.existsSync(tagsDir)) {
              const tagEntries = fs
                .readdirSync(tagsDir, { withFileTypes: true })
                .filter((d) => d.isFile() && d.name.toLowerCase().endsWith('.json'))
                .sort((a, b) => a.name.localeCompare(b.name));

              for (const entry of tagEntries) {
                const fullPath = path.join(tagsDir, entry.name);
                if (!isFileConfinedInDir(tagsDir, fullPath)) continue;
                const inspected = inspectDiskJsonFile(fullPath);
                if (!inspected.ok) {
                  files.push({
                    id: `Tags/${entry.name}`,
                    folderPath: 'Tags/',
                    fileName: entry.name,
                    kind: 'tag',
                    sizeBytes: inspected.sizeBytes,
                    updatedAt: inspected.updatedAt,
                    content: inspected.content,
                    isCorrupted: true,
                    corruptReason: inspected.reason,
                  });
                  continue;
                }
                tags.push({
                  ...inspected.parsed,
                  _tavernsmithType: 'tag',
                  _diskFileName: entry.name,
                  _diskUpdatedAt: inspected.updatedAt,
                });
                files.push({
                  id: `Tags/${entry.name}`,
                  folderPath: 'Tags/',
                  fileName: entry.name,
                  kind: 'tag',
                  sizeBytes: inspected.sizeBytes,
                  updatedAt: inspected.updatedAt,
                  content: inspected.content,
                });
              }
            }

            const metaPath = path.join(resolvedPath, META_FILENAME);
            if (fs.existsSync(metaPath) && isFileConfinedInDir(resolvedPath, metaPath)) {
              const inspected = inspectDiskJsonFile(metaPath);
              if (!inspected.ok) {
                files.push({
                  id: `/${META_FILENAME}`,
                  folderPath: '/',
                  fileName: META_FILENAME,
                  kind: 'meta',
                  sizeBytes: inspected.sizeBytes,
                  updatedAt: inspected.updatedAt,
                  content: inspected.content,
                  isCorrupted: true,
                  corruptReason: inspected.reason,
                });
              } else {
                meta = inspected.parsed;
                files.push({
                  id: `/${META_FILENAME}`,
                  folderPath: '/',
                  fileName: META_FILENAME,
                  kind: 'meta',
                  sizeBytes: inspected.sizeBytes,
                  updatedAt: inspected.updatedAt,
                  content: inspected.content,
                });
              }
            }

            return {
              ok: true,
              diskRoot,
              resolvedPath: diskRoot,
              characters,
              lorebooks,
              themes,
              tags,
              meta,
              vault: null,
              files,
              updatedAt: new Date().toISOString(),
            };
          }

          function saveToSavesDirectoryOnDisk(body) {
            const { resolvedPath, charsDir, loreDir, themesDir, tagsDir } =
              resolveSavesRoot();

            if (Array.isArray(body.characters)) {
              const usedCharTargets = new Set();
              const writtenCharFiles = new Set();

              for (const item of body.characters) {
                if (!item || typeof item !== 'object') continue;
                const payload = item.payload || item;
                if (payload._tavernsmithType === 'lorebook') continue;
                const rawName =
                  item.fileName ||
                  (payload.data &&
                  typeof payload.data === 'object' &&
                  typeof payload.data.name === 'string'
                    ? String(payload.data.name)
                    : typeof payload.name === 'string'
                      ? payload.name
                      : 'untitled');
                const targetFileName = reserveUniqueDiskFileName(rawName, usedCharTargets);
                const outContent =
                  typeof item.content === 'string'
                    ? item.content
                    : JSON.stringify(
                        {
                          ...payload,
                          _tavernsmithType: 'character',
                        },
                        null,
                        2
                      );

                fs.writeFileSync(path.join(charsDir, targetFileName), outContent, 'utf8');
                writtenCharFiles.add(targetFileName.toLowerCase());
              }

              pruneValidOrphanJsonFiles(charsDir, writtenCharFiles);
            }

            if (Array.isArray(body.lorebooks)) {
              const usedLoreTargets = new Set();
              const writtenBookFiles = new Set();

              for (const item of body.lorebooks) {
                if (!item || typeof item !== 'object') continue;
                const payload = item.payload || item;
                if (payload._tavernsmithType === 'character') continue;
                const rawName =
                  item.fileName ||
                  (typeof payload.name === 'string' ? payload.name : 'untitled_lorebook');
                const targetFileName = reserveUniqueDiskFileName(rawName, usedLoreTargets);
                const outContent =
                  typeof item.content === 'string'
                    ? item.content
                    : JSON.stringify(
                        {
                          ...payload,
                          _tavernsmithType: 'lorebook',
                        },
                        null,
                        2
                      );

                fs.writeFileSync(path.join(loreDir, targetFileName), outContent, 'utf8');
                writtenBookFiles.add(targetFileName.toLowerCase());
              }

              pruneValidOrphanJsonFiles(loreDir, writtenBookFiles);
            }

            if (Array.isArray(body.themes)) {
              const usedThemeTargets = new Set();
              const writtenThemeFiles = new Set();

              for (const item of body.themes) {
                if (!item || typeof item !== 'object') continue;
                const payload = item.payload || item;
                const rawName =
                  item.fileName ||
                  (typeof payload.name === 'string' ? payload.name : 'custom_theme');
                const targetFileName = reserveUniqueDiskFileName(rawName, usedThemeTargets);
                const outContent =
                  typeof item.content === 'string'
                    ? item.content
                    : JSON.stringify({
                        ...payload,
                        _tavernsmithType: 'theme',
                      });

                fs.writeFileSync(path.join(themesDir, targetFileName), outContent, 'utf8');
                writtenThemeFiles.add(targetFileName.toLowerCase());
              }

              pruneValidOrphanJsonFiles(themesDir, writtenThemeFiles);
            }

            if (Array.isArray(body.tags)) {
              const usedTagTargets = new Set();
              const writtenTagFiles = new Set();

              for (const item of body.tags) {
                if (!item || typeof item !== 'object') continue;
                const payload = item.payload || item;
                const rawName =
                  item.fileName ||
                  (typeof payload.name === 'string' ? payload.name : 'custom_tag');
                const targetFileName = reserveUniqueDiskFileName(rawName, usedTagTargets);
                const outContent =
                  typeof item.content === 'string'
                    ? item.content
                    : JSON.stringify({
                        ...payload,
                        _tavernsmithType: 'tag',
                      });

                fs.writeFileSync(path.join(tagsDir, targetFileName), outContent, 'utf8');
                writtenTagFiles.add(targetFileName.toLowerCase());
              }

              pruneValidOrphanJsonFiles(tagsDir, writtenTagFiles);
            }

            if (body.meta && typeof body.meta === 'object') {
              fs.writeFileSync(
                path.join(resolvedPath, META_FILENAME),
                JSON.stringify(body.meta, null, 2),
                'utf8'
              );
            }

            return scanSavesDirectoryOnDisk();
          }

          function deleteFromSavesDirectoryOnDisk(body) {
            const { resolvedPath, charsDir, loreDir, themesDir, tagsDir } =
              resolveSavesRoot();

            const rawFolder = String(body.folder || body.kind || '').toLowerCase();

            const candidateNames = new Set();
            const rawFileName =
              typeof body.fileName === 'string' ? body.fileName.trim() : '';
            const rawSavedFileName =
              typeof body.savedFileName === 'string' ? body.savedFileName.trim() : '';
            const rawName = typeof body.name === 'string' ? body.name.trim() : '';
            const rawId = typeof body.id === 'string' ? body.id.trim() : '';

            if (rawFileName) candidateNames.add(path.basename(rawFileName));
            if (rawSavedFileName) candidateNames.add(path.basename(rawSavedFileName));

            if (rawFolder === 'root' || rawFolder === 'meta') {
              for (const name of candidateNames) {
                if (name !== META_FILENAME) continue;
                const targetPath = path.join(resolvedPath, name);
                if (fs.existsSync(targetPath) && isFileConfinedInDir(resolvedPath, targetPath)) {
                  try {
                    fs.unlinkSync(targetPath);
                  } catch {}
                }
              }
              return scanSavesDirectoryOnDisk();
            }

            if (rawFolder === 'vault') {
              return scanSavesDirectoryOnDisk();
            }

            const targetDir =
