                          continue
                      obj = dict(inspected["parsed"])
                      obj["_tavernsmithType"] = "theme"
                      obj["_diskFileName"] = name
                      obj["_diskUpdatedAt"] = inspected["updatedAt"]
                      themes.append(obj)
                      files.append({
                          "id": f"Themes/{name}",
                          "folderPath": "Themes/",
                          "fileName": name,
                          "kind": "theme",
                          "sizeBytes": inspected["sizeBytes"],
                          "updatedAt": inspected["updatedAt"],
                          "content": inspected["content"],
                      })

              if os.path.isdir(dirs["tagsDir"]):
                  for name in sorted(os.listdir(dirs["tagsDir"])):
                      if not name.lower().endswith(".json"):
                          continue
                      full_path = os.path.join(dirs["tagsDir"], name)
                      if not os.path.isfile(full_path) or not is_file_confined_in_dir(dirs["tagsDir"], full_path):
                          continue
                      inspected = inspect_disk_json_file(full_path)
                      if not inspected["ok"]:
                          files.append({
                              "id": f"Tags/{name}",
                              "folderPath": "Tags/",
                              "fileName": name,
                              "kind": "tag",
                              "sizeBytes": inspected["sizeBytes"],
                              "updatedAt": inspected["updatedAt"],
                              "content": inspected["content"],
                              "isCorrupted": True,
                              "corruptReason": inspected["reason"],
                          })
                          continue
                      obj = dict(inspected["parsed"])
                      obj["_tavernsmithType"] = "tag"
                      obj["_diskFileName"] = name
                      obj["_diskUpdatedAt"] = inspected["updatedAt"]
                      tags.append(obj)
                      files.append({
                          "id": f"Tags/{name}",
                          "folderPath": "Tags/",
                          "fileName": name,
                          "kind": "tag",
                          "sizeBytes": inspected["sizeBytes"],
                          "updatedAt": inspected["updatedAt"],
                          "content": inspected["content"],
                      })

              meta_path = os.path.join(dirs["resolvedPath"], META_FILENAME)
              if os.path.isfile(meta_path) and is_file_confined_in_dir(dirs["resolvedPath"], meta_path):
                  inspected = inspect_disk_json_file(meta_path)
                  if not inspected["ok"]:
                      meta = None
                      files.append({
                          "id": f"/{META_FILENAME}",
                          "folderPath": "/",
                          "fileName": META_FILENAME,
                          "kind": "meta",
                          "sizeBytes": inspected["sizeBytes"],
                          "updatedAt": inspected["updatedAt"],
                          "content": inspected["content"],
                          "isCorrupted": True,
                          "corruptReason": inspected["reason"],
                      })
                  else:
                      meta = inspected["parsed"]
                      files.append({
                          "id": f"/{META_FILENAME}",
                          "folderPath": "/",
                          "fileName": META_FILENAME,
                          "kind": "meta",
                          "sizeBytes": inspected["sizeBytes"],
                          "updatedAt": inspected["updatedAt"],
                          "content": inspected["content"],
                      })

              return {
                  "ok": True,
                  "diskRoot": dirs["diskRoot"],
                  "resolvedPath": dirs["diskRoot"],
                  "characters": characters,
                  "lorebooks": lorebooks,
                  "themes": themes,
                  "tags": tags,
                  "meta": meta,
                  "vault": None,
                  "files": files,
                  "updatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              }

          def save_to_saves_directory_on_disk(body):
              with DISK_LOCK:
                  dirs = resolve_saves_root()

                  if isinstance(body.get("characters"), list):
                      used_char_targets = set()
                      written_char_files = set()
                      for item in body["characters"]:
                          if not isinstance(item, dict):
                              continue
                          payload = item.get("payload") if isinstance(item.get("payload"), dict) else item
                          if payload.get("_tavernsmithType") == "lorebook":
                              continue
                          data_node = payload.get("data") if isinstance(payload.get("data"), dict) else {}
                          raw_name = item.get("fileName") or data_node.get("name") or payload.get("name") or "untitled"
                          target_file = reserve_unique_disk_file_name(raw_name, used_char_targets)
                          if isinstance(item.get("content"), str):
                              out_content = item["content"]
                          else:
                              out_obj = dict(payload)
                              out_obj["_tavernsmithType"] = "character"
                              out_content = json.dumps(out_obj, indent=2)
                          with open(os.path.join(dirs["charsDir"], target_file), "w", encoding="utf-8") as f:
                              f.write(out_content)
                          written_char_files.add(target_file.lower())
                      prune_valid_orphan_json_files(dirs["charsDir"], written_char_files)

                  if isinstance(body.get("lorebooks"), list):
                      used_lore_targets = set()
                      written_book_files = set()
                      for item in body["lorebooks"]:
                          if not isinstance(item, dict):
                              continue
                          payload = item.get("payload") if isinstance(item.get("payload"), dict) else item
                          if payload.get("_tavernsmithType") == "character":
                              continue
                          raw_name = item.get("fileName") or payload.get("name") or "untitled_lorebook"
                          target_file = reserve_unique_disk_file_name(raw_name, used_lore_targets)
                          if isinstance(item.get("content"), str):
                              out_content = item["content"]
                          else:
                              out_obj = dict(payload)
                              out_obj["_tavernsmithType"] = "lorebook"
                              out_content = json.dumps(out_obj, indent=2)
                          with open(os.path.join(dirs["loreDir"], target_file), "w", encoding="utf-8") as f:
                              f.write(out_content)
                          written_book_files.add(target_file.lower())
                      prune_valid_orphan_json_files(dirs["loreDir"], written_book_files)

                  if isinstance(body.get("themes"), list):
                      used_theme_targets = set()
                      written_theme_files = set()
                      for item in body["themes"]:
                          if not isinstance(item, dict):
                              continue
                          payload = item.get("payload") if isinstance(item.get("payload"), dict) else item
                          raw_name = item.get("fileName") or payload.get("name") or "custom_theme"
                          target_file = reserve_unique_disk_file_name(raw_name, used_theme_targets)
                          if isinstance(item.get("content"), str):
                              out_content = item["content"]
                          else:
                              out_obj = dict(payload)
                              out_obj["_tavernsmithType"] = "theme"
                              out_content = json.dumps(out_obj)
                          with open(os.path.join(dirs["themesDir"], target_file), "w", encoding="utf-8") as f:
                              f.write(out_content)
                          written_theme_files.add(target_file.lower())
                      prune_valid_orphan_json_files(dirs["themesDir"], written_theme_files)

                  if isinstance(body.get("tags"), list):
                      used_tag_targets = set()
                      written_tag_files = set()
                      for item in body["tags"]:
                          if not isinstance(item, dict):
                              continue
                          payload = item.get("payload") if isinstance(item.get("payload"), dict) else item
                          raw_name = item.get("fileName") or payload.get("name") or "custom_tag"
                          target_file = reserve_unique_disk_file_name(raw_name, used_tag_targets)
                          if isinstance(item.get("content"), str):
                              out_content = item["content"]
                          else:
                              out_obj = dict(payload)
                              out_obj["_tavernsmithType"] = "tag"
                              out_content = json.dumps(out_obj)
                          with open(os.path.join(dirs["tagsDir"], target_file), "w", encoding="utf-8") as f:
                              f.write(out_content)
                          written_tag_files.add(target_file.lower())
                      prune_valid_orphan_json_files(dirs["tagsDir"], written_tag_files)

                  if isinstance(body.get("meta"), dict):
                      with open(os.path.join(dirs["resolvedPath"], META_FILENAME), "w", encoding="utf-8") as f:
                          f.write(json.dumps(body["meta"], indent=2))

                  return scan_saves_directory_on_disk()

          def delete_from_saves_directory_on_disk(body):
              with DISK_LOCK:
                  dirs = resolve_saves_root()

                  raw_folder = str(body.get("folder") or body.get("kind") or "").lower()

                  candidate_names = set()
                  raw_file_name = body.get("fileName").strip() if isinstance(body.get("fileName"), str) else ""
                  raw_saved_file_name = body.get("savedFileName").strip() if isinstance(body.get("savedFileName"), str) else ""
                  raw_name = body.get("name").strip() if isinstance(body.get("name"), str) else ""
                  raw_id = body.get("id").strip() if isinstance(body.get("id"), str) else ""

                  if raw_file_name:
                      candidate_names.add(os.path.basename(raw_file_name))
                  if raw_saved_file_name:
                      candidate_names.add(os.path.basename(raw_saved_file_name))

                  if raw_folder in ("root", "meta"):
                      for name in candidate_names:
                          if name != META_FILENAME:
                              continue
                          target_path = os.path.join(dirs["resolvedPath"], name)
                          if os.path.isfile(target_path) and is_file_confined_in_dir(dirs["resolvedPath"], target_path):
                              try:
                                  os.unlink(target_path)
                              except Exception:
                                  pass
                      return scan_saves_directory_on_disk()

                  if raw_folder == "vault":
                      return scan_saves_directory_on_disk()

                  if raw_folder in ("lorebooks", "lorebook"):
                      target_dir = dirs["loreDir"]
                  elif raw_folder in ("themes", "theme"):
                      target_dir = dirs["themesDir"]
                  elif raw_folder in ("tags", "tag"):
                      target_dir = dirs["tagsDir"]
                  else:
                      target_dir = dirs["charsDir"]

                  deleted_any = False
                  for name in candidate_names:
                      if not name or name in (".", "..") or not name.lower().endswith(".json"):
                          continue
                      target_path = os.path.join(target_dir, name)
                      rel = os.path.relpath(target_path, target_dir)
                      if not rel or rel == "." or rel.startswith("..") or os.path.isabs(rel):
                          continue
                      if os.path.isfile(target_path) and is_file_confined_in_dir(target_dir, target_path):
                          try:
                              os.unlink(target_path)
                              deleted_any = True
                          except Exception:
                              pass

                  if raw_id and os.path.isdir(target_dir):
                      for entry_name in os.listdir(target_dir):
                          if not entry_name.lower().endswith(".json"):
                              continue
                          full_path = os.path.join(target_dir, entry_name)
                          if not os.path.isfile(full_path) or not is_file_confined_in_dir(target_dir, full_path):
                              continue
                          try:
                              with open(full_path, "r", encoding="utf-8") as f:
                                  parsed = json.load(f)
                              if extract_entity_id_from_json(parsed) == raw_id:
                                  os.unlink(full_path)
                                  deleted_any = True
                          except Exception:
                              pass

                  if not deleted_any and raw_name:
                      sanitized_target = os.path.join(target_dir, sanitize_disk_file_name(raw_name))
                      if os.path.isfile(sanitized_target) and is_file_confined_in_dir(target_dir, sanitized_target):
                          try:
                              os.unlink(sanitized_target)
                          except Exception:
                              pass

                  return scan_saves_directory_on_disk()

          resolve_saves_root()
          resolve_app_vault_paths()

          class TavernSmithHandler(http.server.SimpleHTTPRequestHandler):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, directory=ROOT_DIR, **kwargs)

              def end_headers(self):
                  self.send_header("Cache-Control", "no-store, no-cache, must-revalidate")
                  self.send_header("X-Content-Type-Options", "nosniff")
                  self.send_header("Referrer-Policy", "no-referrer")
                  super().end_headers()

              def list_directory(self, path):
                  self.send_error(404, "Directory listing disabled")
                  return None

              def send_json(self, status, payload):
                  body = json.dumps(payload).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def _prepare_static_path(self):
                  parsed_url = urllib.parse.urlparse(self.path)
                  raw_path = parsed_url.path or "/"
                  if is_blocked_static_path(raw_path):
                      self.send_error(403, "Forbidden")
                      return False

                  root_real = get_canonical_workspace_root()
                  rel_candidate = urllib.parse.unquote(raw_path).replace("\\", "/").lstrip("/")
                  if not rel_candidate:
                      self.path = "/index.html"
                      return True

                  full_candidate = os.path.abspath(os.path.join(root_real, rel_candidate))
                  if (
                      not os.path.isfile(full_candidate)
                      or not is_file_confined_in_dir(root_real, full_candidate)
                      or is_blocked_static_path(os.path.relpath(full_candidate, root_real))
                  ):
                      self.path = "/index.html"
                  return True

              def do_HEAD(self):
                  parsed_url = urllib.parse.urlparse(self.path)
                  if parsed_url.path.startswith("/api/"):
                      self.send_error(405, "Method Not Allowed")
                      return
                  if not self._prepare_static_path():
                      return
                  return super().do_HEAD()

              def do_GET(self):
                  parsed_url = urllib.parse.urlparse(self.path)
                  if parsed_url.path.startswith("/api/"):
                      ok, status, err_msg = validate_local_api_request(self.headers, False)
                      if not ok:
                          self.send_json(status, {"ok": False, "error": err_msg})
                          return
                      if parsed_url.path == "/api/disk/state":
                          with DISK_LOCK:
                              self.send_json(200, scan_saves_directory_on_disk())
                          return
                      if parsed_url.path == "/api/vault":
                          self.send_json(200, read_app_vault_state_on_disk())
                          return
                      self.send_json(404, {"ok": False, "error": "Not found"})
                      return

                  if not self._prepare_static_path():
                      return
                  return super().do_GET()

              def do_POST(self):
                  parsed_url = urllib.parse.urlparse(self.path)
                  if not parsed_url.path.startswith("/api/"):
                      self.send_json(404, {"ok": False, "error": "Not found"})
                      return

                  ok, status, err_msg = validate_local_api_request(self.headers, True)
                  if not ok:
                      self.send_json(status, {"ok": False, "error": err_msg})
                      return

                  try:
                      length = int(self.headers.get("Content-Length", "0"))
                  except ValueError:
                      self.send_json(400, {"ok": False, "error": "Invalid Content-Length header"})
                      return

                  if length < 0 or length > MAX_BODY_BYTES:
                      self.send_json(413, {"ok": False, "error": "Request body exceeds 128 MB limit"})
                      return

                  try:
                      raw_body = self.rfile.read(length).decode("utf-8") if length > 0 else "{}"
                      body = json.loads(raw_body or "{}")
                      if not isinstance(body, dict):
                          self.send_json(400, {"ok": False, "error": "JSON body must be an object"})
                          return
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      self.send_json(400, {"ok": False, "error": "Invalid JSON request body"})
                      return

                  try:
                      if parsed_url.path == "/api/disk/save":
                          self.send_json(200, save_to_saves_directory_on_disk(body))
                          return

                      if parsed_url.path == "/api/disk/delete":
                          self.send_json(200, delete_from_saves_directory_on_disk(body))
                          return

                      if parsed_url.path == "/api/vault":
                          self.send_json(200, save_app_vault_state_on_disk(body))
                          return

                      self.send_json(404, {"ok": False, "error": "Not found"})
                  except Exception as exc:
                      self.send_json(500, {"ok": False, "error": str(exc) or "Server error"})

          if __name__ == "__main__":
              print(f"TavernSmith local disk server running at http://{HOST}:{PORT}")
              print(f"Direct disk storage active in: {os.path.abspath(os.path.join(ROOT_DIR, 'Saves'))}")
              with http.server.ThreadingHTTPServer((HOST, PORT), TavernSmithHandler) as httpd:
                  httpd.serve_forever()
          EOF

          chmod +x dist/server.cjs dist/server.py

          cat << 'EOF' > dist/Launch-TavernSmith-Windows.bat
          @echo off
          cd /d "%~dp0"
          setlocal
          title TavernSmith Standalone Launcher (Direct ./Saves/ Disk Mode)
          set PORT=4173
          set URL=http://127.0.0.1:%PORT%/?nocache=%RANDOM%

          if not exist "Saves\Characters" mkdir "Saves\Characters"
          if not exist "Saves\Lorebooks" mkdir "Saves\Lorebooks"
          if not exist "Saves\Themes" mkdir "Saves\Themes"
          if not exist "Saves\Tags" mkdir "Saves\Tags"

          echo ===================================================
          echo   TavernSmith - SillyTavern V2/V3 Character IDE
          echo   Direct Local Disk Storage: .\Saves\
          echo ===================================================
          echo.

          where node >nul 2>nul
          if %ERRORLEVEL% EQU 0 (
            echo Starting TavernSmith Local Disk Server via Node.js on %URL% ...
            start "" /b cmd /c "timeout /t 2 /nobreak >nul && (start "" msedge --app="%URL%" 2>nul || start "" chrome --app="%URL%" 2>nul || start "" "%URL%")"
            node server.cjs
            goto :eof
          )

          where python >nul 2>nul
          if %ERRORLEVEL% EQU 0 (
            echo Starting TavernSmith Local Disk Server via Python on %URL% ...
            start "" /b cmd /c "timeout /t 2 /nobreak >nul && (start "" msedge --app="%URL%" 2>nul || start "" chrome --app="%URL%" 2>nul || start "" "%URL%")"
            python server.py
            goto :eof
          )

          where py >nul 2>nul
          if %ERRORLEVEL% EQU 0 (
            echo Starting TavernSmith Local Disk Server via Python Launcher on %URL% ...
            start "" /b cmd /c "timeout /t 2 /nobreak >nul && (start "" msedge --app="%URL%" 2>nul || start "" chrome --app="%URL%" 2>nul || start "" "%URL%")"
            py -3 server.py
            goto :eof
          )

          echo ERROR: Please install Node.js (https://nodejs.org) or Python 3 (https://python.org) to run the local ./Saves/ disk server.
          pause
          EOF

          cat << 'EOF' > dist/Launch-TavernSmith-Mac-Linux.command
          #!/usr/bin/env bash
          cd "$(dirname "$0")" || exit 1
          PORT=4173
          URL="http://127.0.0.1:${PORT}/?nocache=$(date +%s)"

          mkdir -p "./Saves/Characters" "./Saves/Lorebooks" "./Saves/Themes" "./Saves/Tags"

          echo "==================================================="
          echo "  TavernSmith — SillyTavern V2/V3 Character IDE"
          echo "  Direct Local Disk Storage: ./Saves/"
          echo "==================================================="

          open_url() {
            if [[ "$OSTYPE" == "darwin"* ]]; then
              open "$1"
            elif command -v xdg-open >/dev/null 2>&1; then
              xdg-open "$1" >/dev/null 2>&1 &
            fi
          }

          if command -v node >/dev/null 2>&1; then
            echo "Starting TavernSmith Local Disk Server via Node on ${URL} (Press Ctrl+C to stop)..."
            (sleep 1 && open_url "${URL}") &
            node ./server.cjs
          elif command -v python3 >/dev/null 2>&1; then
            echo "Starting TavernSmith Local Disk Server via Python 3 on ${URL} (Press Ctrl+C to stop)..."
            (sleep 1 && open_url "${URL}") &
            python3 ./server.py
          elif command -v python >/dev/null 2>&1; then
            echo "Starting TavernSmith Local Disk Server via Python on ${URL} (Press Ctrl+C to stop)..."
            (sleep 1 && open_url "${URL}") &
            python ./server.py
          else
            echo "ERROR: Please install Node.js or Python 3 to run the local ./Saves/ disk server."
          fi
          EOF

          chmod +x dist/Launch-TavernSmith-Mac-Linux.command

          cat << 'EOF' > dist/README-PORTABLE.txt
          TavernSmith — Portable Ready-to-Run Application
          ===============================================
          Your Characters, Lorebooks, Custom Tags, Context Themes, and Workspace Metadata
          are stored directly on disk in `./Saves/`:
            - ./Saves/Characters/
            - ./Saves/Lorebooks/
            - ./Saves/Themes/
            - ./Saves/Tags/
            - ./Saves/_tavernsmith_meta.json

          Your AES-256-GCM Encrypted API Keys are stored separately outside `./Saves/` in:
            - ./.tavernsmith-app/credentials.vault.enc
            - ./.tavernsmith-app/vault.key
          (API keys are never included in `./Saves/` or in workspace backup exports.)

          1. WINDOWS:
             Double-click "Launch-TavernSmith-Windows.bat" (No Administrator privileges required).

          2. macOS (Intel & Apple Silicon ARM) / LINUX:
             Double-click "Launch-TavernSmith-Mac-Linux.command"
             (or run `./Launch-TavernSmith-Mac-Linux.command` in Terminal).
          EOF

      - name: Package ONLY Compiled Production App (dist/) into TavernSmith-App-Portable.zip
        run: |
          cd dist && zip -r ../TavernSmith-App-Portable.zip .

      - name: Extract Latest Release Notes & Publish GitHub Release via GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi

          TARGET_TAG="$TAG" node - << 'EOF'
          const fs = require('fs');
          const pkg = require('./package.json');
          const targetTag = (process.env.TARGET_TAG || `v${pkg.version}`).trim();
          const bareVersion = targetTag.replace(/^v/i, '');
          const changelog = fs.existsSync('CHANGELOG.md')
            ? fs.readFileSync('CHANGELOG.md', 'utf8')
            : '';

          const downloadCallout = "> 📦 **Download Ready-to-Run App:** Click **TavernSmith-App-Portable.zip** below under Assets to download the standalone compiled application (do not download the 'Source code' archives).\n\n";

          const sections = changelog
            .split(/\n(?=## \[)/)
            .map((s) => s.trim())
            .filter((s) => s.startsWith('## ['));

          const exactMatch = sections.find((s) => {
            const m = s.match(/^## \[([^\]]+)\]/);
            if (!m) return false;
            const heading = m[1].trim();
            return heading === targetTag || heading === bareVersion || heading === `v${bareVersion}`;
          });

          const firstVersioned = sections.find((s) => !/^## \[unreleased\]/i.test(s));
          const unreleased = sections.find((s) => /^## \[unreleased\]/i.test(s));

          const notes =
            exactMatch ||
            firstVersioned ||
            unreleased ||
            `## TavernSmith v${pkg.version}\n\nUniversal Portable Release for Windows, macOS (x64 & Apple Silicon ARM), and Linux with direct ./Saves/ local disk persistence.`;

          fs.writeFileSync('RELEASE_NOTES.md', downloadCallout + notes + '\n', 'utf8');
          EOF

          echo "Publishing GitHub Release for tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" TavernSmith-App-Portable.zip --clobber
            gh release edit "$TAG" --title "TavernSmith $TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" TavernSmith-App-Portable.zip --title "TavernSmith $TAG" --notes-file RELEASE_NOTES.md
          fi
