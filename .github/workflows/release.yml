name: Desktop App Release (Windows, macOS & Linux)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows (Portable .exe)
            os: windows-latest
            platform: windows
            artifact_name: tavernsmith-windows-zip
            zip_name: TavernSmith-Windows-x64-Portable.zip
          - label: macOS (Universal .dmg)
            os: macos-latest
            platform: macos
            artifact_name: tavernsmith-macos-zip
            zip_name: TavernSmith-macOS-Universal-DMG.zip
          - label: Linux (x64 .AppImage)
            os: ubuntu-24.04
            platform: linux
            artifact_name: tavernsmith-linux-zip
            zip_name: TavernSmith-Linux-x64-AppImage.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24 (Native Action, No Lockfile Cache)
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Linux Tauri v2 System Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            patchelf \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust Toolchain (macOS Universal Targets)
        if: matrix.platform == 'macos'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Rust Toolchain (Windows & Linux)
        if: matrix.platform != 'macos'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Crates & Target Directory
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript Verification
        run: npm run lint

      - name: Run Rust Storage & Security Unit Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Generate Platform Application Icons
        run: npx --yes @tauri-apps/cli@2 icon public/pwa-512x512.png

      - name: Build & Package Windows Portable App (.exe -> .zip)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          npx --yes @tauri-apps/cli@2 build --no-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exePath = "src-tauri\target\release\tavernsmith.exe"
          if (-not (Test-Path -LiteralPath $exePath)) {
            throw "Expected Windows executable was not generated at $exePath"
          }

          if (Test-Path -LiteralPath "release-stage") { Remove-Item -Recurse -Force "release-stage" }
          if (Test-Path -LiteralPath "TavernSmith-Windows-x64-Portable.zip") { Remove-Item -Force "TavernSmith-Windows-x64-Portable.zip" }

          New-Item -ItemType Directory -Path "release-stage" | Out-Null
          Copy-Item -LiteralPath $exePath -Destination "release-stage\TavernSmith.exe"

          @'
          TavernSmith — Windows x64 Portable Desktop App
          ==============================================

          HOW TO RUN:
            1. Extract this archive into any writable folder (for example, Desktop, Documents, or a USB drive).
            2. Double-click "TavernSmith.exe".
               - No installer or Administrator privileges required.
               - No CMD / terminal window will open.

          SAVE & API KEY LOCATIONS (PORTABLE):
            - Characters, Lorebooks, Themes, Tags, and Workspace Metadata are saved right next to
              TavernSmith.exe inside:
                .\Saves\Characters\
                .\Saves\Lorebooks\
                .\Saves\Themes\
                .\Saves\Tags\
                .\Saves\_tavernsmith_meta.json
            - Encrypted API keys (AES-256-GCM) are stored separately outside .\Saves\ in:
                .\.tavernsmith-app\credentials.vault.enc
                .\.tavernsmith-app\vault.key
            - If the app is launched from a read-only folder (such as Program Files), TavernSmith
              automatically falls back to %APPDATA%\TavernSmith\Saves\.
            - Click "Open Folder" inside Options at any time to open your active Saves folder.

          REQUIREMENTS:
            - Windows 10 or Windows 11 (x64) with Microsoft Edge WebView2 Runtime (preinstalled on
              modern Windows 10/11 systems).
          '@ | Set-Content -LiteralPath "release-stage\README-Windows.txt" -Encoding UTF8

          Compress-Archive -Path "release-stage\*" -DestinationPath "TavernSmith-Windows-x64-Portable.zip" -Force
          Get-Item -LiteralPath "TavernSmith-Windows-x64-Portable.zip" | Select-Object Name, Length

      - name: Build & Package macOS Universal App (.dmg -> .zip)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @tauri-apps/cli@2 build --bundles dmg --target universal-apple-darwin

          DMG_FILE=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | head -n 1)
          if [ -z "${DMG_FILE}" ] || [ ! -f "${DMG_FILE}" ]; then
            echo "ERROR: Expected macOS Universal .dmg bundle was not generated."
            exit 1
          fi

          rm -rf release-stage TavernSmith-macOS-Universal-DMG.zip
          mkdir -p release-stage
          cp "${DMG_FILE}" release-stage/TavernSmith.dmg

          cat << 'EOF' > release-stage/README-macOS.txt
          TavernSmith — macOS Universal Desktop App (Apple Silicon & Intel)
          =================================================================

          HOW TO INSTALL & RUN:
            1. Extract this archive and open "TavernSmith.dmg".
            2. Drag "TavernSmith.app" into your Applications folder.
            3. Launch TavernSmith from Applications.
               - Because this community release is not notarized with an Apple Developer ID,
                 macOS Gatekeeper may warn on first launch. Right-click TavernSmith.app -> Open
                 (or run: xattr -cr /Applications/TavernSmith.app).

          SAVE & API KEY LOCATIONS:
            - Because macOS .app/.dmg bundles mount read-only, your Saves folder is stored in:
                ~/Library/Application Support/TavernSmith/Saves/
            - Encrypted API keys (AES-256-GCM) are stored separately outside Saves in:
                ~/Library/Application Support/TavernSmith/.tavernsmith-app/
            - Click "Open Folder" inside Options at any time to reveal your Saves folder in Finder.
          EOF

          (cd release-stage && zip -r ../TavernSmith-macOS-Universal-DMG.zip .)
          ls -lh TavernSmith-macOS-Universal-DMG.zip

      - name: Build & Package Linux x64 AppImage (.AppImage -> .zip)
        if: matrix.platform == 'linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          set -euo pipefail
          npx --yes @tauri-apps/cli@2 build --bundles appimage

          APPIMAGE_FILE=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | head -n 1)
          if [ -z "${APPIMAGE_FILE}" ] || [ ! -f "${APPIMAGE_FILE}" ]; then
            echo "ERROR: Expected Linux .AppImage bundle was not generated."
            exit 1
          fi

          rm -rf release-stage TavernSmith-Linux-x64-AppImage.zip
          mkdir -p release-stage
          cp "${APPIMAGE_FILE}" release-stage/TavernSmith.AppImage
          chmod +x release-stage/TavernSmith.AppImage

          cat << 'EOF' > release-stage/README-Linux.txt
          TavernSmith — Linux x64 Portable Desktop App (.AppImage)
          ========================================================

          HOW TO RUN:
            1. Extract this archive into any writable folder.
            2. Make the AppImage executable (if needed) and launch it:
                 chmod +x TavernSmith.AppImage
                 ./TavernSmith.AppImage
            3. If your distribution does not include FUSE 2 (e.g., Ubuntu 24.04+), either:
                 - Run without FUSE: APPIMAGE_EXTRACT_AND_RUN=1 ./TavernSmith.AppImage
                 - Or install FUSE 2: sudo apt install libfuse2t64  (or libfuse2)
            4. If you encounter blank/glitched WebKitGTK rendering on Wayland, launch with:
                 WEBKIT_DISABLE_COMPOSITING_MODE=1 ./TavernSmith.AppImage

          SAVE & API KEY LOCATIONS (PORTABLE):
            - Characters, Lorebooks, Themes, Tags, and Workspace Metadata are saved right next to
              TavernSmith.AppImage inside:
                ./Saves/Characters/
                ./Saves/Lorebooks/
                ./Saves/Themes/
                ./Saves/Tags/
                ./Saves/_tavernsmith_meta.json
            - Encrypted API keys (AES-256-GCM) are stored separately outside ./Saves/ in:
                ./.tavernsmith-app/credentials.vault.enc
                ./.tavernsmith-app/vault.key
            - If the AppImage is placed in a read-only directory, TavernSmith automatically falls
              back to $XDG_DATA_HOME/TavernSmith/Saves/ (or ~/.local/share/TavernSmith/Saves/).
            - Click "Open Folder" inside Options at any time to open your active Saves folder.
          EOF

          (cd release-stage && zip -r ../TavernSmith-Linux-x64-AppImage.zip .)
          ls -lh TavernSmith-Linux-x64-AppImage.zip

      - name: Upload ${{ matrix.label }} Release Archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.zip_name }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release (3 OS Archives)
    needs: [build-desktop]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 24 (Native Action, No Lockfile Cache)
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download All 3 OS Release Archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify All 3 OS Zip Archives Exist
        run: |
          set -euo pipefail
          for archive in \
            release-assets/TavernSmith-Windows-x64-Portable.zip \
            release-assets/TavernSmith-macOS-Universal-DMG.zip \
            release-assets/TavernSmith-Linux-x64-AppImage.zip; do
            if [ ! -s "$archive" ]; then
              echo "ERROR: Missing or empty release archive: $archive"
              exit 1
            fi
          done
          ls -lh release-assets/

      - name: Extract Latest Release Notes & Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi

          TARGET_TAG="$TAG" node - << 'EOF'
          const fs = require('fs');
          const pkg = require('./package.json');
          const targetTag = (process.env.TARGET_TAG || `v${pkg.version}`).trim();
          const bareVersion = targetTag.replace(/^v/i, '');
          const changelog = fs.existsSync('CHANGELOG.md')
            ? fs.readFileSync('CHANGELOG.md', 'utf8')
            : '';

          const downloadCallout = [
            '### 📦 Native Desktop Downloads (Zero CMD Window)',
            '',
            'Download the `.zip` matching your operating system under **Assets** below (do not download the "Source code" archives):',
            '',
            '| Operating System | Release Archive | Contents & Save Folder |',
            '| :--- | :--- | :--- |',
            '| **Windows (x64)** | `TavernSmith-Windows-x64-Portable.zip` | Portable `TavernSmith.exe` (no installer, no CMD window) — saves in `./Saves/` next to the `.exe` |',
            '| **macOS (Apple Silicon & Intel)** | `TavernSmith-macOS-Universal-DMG.zip` | Universal `TavernSmith.dmg` — saves in `~/Library/Application Support/TavernSmith/Saves/` |',
            '| **Linux (x64)** | `TavernSmith-Linux-x64-AppImage.zip` | Portable `TavernSmith.AppImage` — saves in `./Saves/` next to the `.AppImage` |',
            '',
            '---',
            '',
          ].join('\n');

          const sections = changelog
            .split(/\n(?=## \[)/)
            .map((s) => s.trim())
            .filter((s) => s.startsWith('## ['));

          const exactMatch = sections.find((s) => {
            const m = s.match(/^## \[([^\]]+)\]/);
            if (!m) return false;
            const heading = m[1].trim();
            return heading === targetTag || heading === bareVersion || heading === `v${bareVersion}`;
          });

          const firstVersioned = sections.find((s) => !/^## \[unreleased\]/i.test(s));
          const unreleased = sections.find((s) => /^## \[unreleased\]/i.test(s));

          const notes =
            exactMatch ||
            firstVersioned ||
            unreleased ||
            `## TavernSmith v${pkg.version}\n\nNative desktop release for Windows (portable .exe), macOS (Universal .dmg), and Linux (.AppImage) with local disk persistence and an app-private encrypted API key vault.`;

          fs.writeFileSync('RELEASE_NOTES.md', downloadCallout + notes + '\n', 'utf8');
          EOF

          echo "Publishing GitHub Release for tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release-assets/TavernSmith-Windows-x64-Portable.zip \
              release-assets/TavernSmith-macOS-Universal-DMG.zip \
              release-assets/TavernSmith-Linux-x64-AppImage.zip \
              --clobber
            gh release delete-asset "$TAG" TavernSmith-App-Portable.zip --yes 2>/dev/null || true
            gh release edit "$TAG" --title "TavernSmith $TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" \
              release-assets/TavernSmith-Windows-x64-Portable.zip \
              release-assets/TavernSmith-macOS-Universal-DMG.zip \
              release-assets/TavernSmith-Linux-x64-AppImage.zip \
              --title "TavernSmith $TAG" \
              --notes-file RELEASE_NOTES.md
          fi
