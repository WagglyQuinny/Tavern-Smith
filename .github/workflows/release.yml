                  parsed = json.loads(content)
                  if not isinstance(parsed, dict):
                      return {
                          "ok": False,
                          "reason": "JSON root must be an object",
                          "content": content[:16384],
                          "sizeBytes": size_bytes,
                          "updatedAt": updated_at,
                      }
                  return {
                      "ok": True,
                      "parsed": parsed,
                      "content": content,
                      "sizeBytes": size_bytes,
                      "updatedAt": updated_at,
                  }
              except Exception as exc:
                  return {
