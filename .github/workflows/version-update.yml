name: Version & Changelog Updater

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semantic version bump type (patch, minor, or major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      release_notes:
        description: 'Optional extra summary note (leave blank for 100% automatic Git analysis)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  bump-version-and-changelog:
    name: Auto-Analyze Git Diff, Bump Version, Sync In-App Changelog & Push Tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 24 (Native Action, No Lockfile Cache)
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Bump Semantic Version & Run Automated Git Repository Changelog Analyzer
        id: version_step
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          CUSTOM_NOTES: ${{ inputs.release_notes }}
        run: |
          set -e

          # Locate the previous version tag if one exists
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          export LAST_TAG
          echo "Previous git tag: ${LAST_TAG:-none}"

          # Bump version in package.json without creating a git tag yet
          RAW_VERSION=$(npm version "${BUMP_TYPE:-patch}" --no-git-tag-version)
          export NEW_VERSION="${RAW_VERSION#v}"
          export TAG_NAME="v${NEW_VERSION}"
          export RELEASE_DATE=$(date -u +"%Y-%m-%d")

          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          # Run in-depth Node.js git analyzer to update CHANGELOG.md, src/versionInfo.json, and src/utils/changelogData.ts
          node - << 'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const newVersion = process.env.NEW_VERSION || require('./package.json').version;
          const tagName = process.env.TAG_NAME || `v${newVersion}`;
          const releaseDate = process.env.RELEASE_DATE || new Date().toISOString().slice(0, 10);
          const lastTag = (process.env.LAST_TAG || '').trim();
          const customNotes = (process.env.CUSTOM_NOTES || '').trim();

          function runGit(cmd) {
            try {
              return execSync(cmd, { encoding: 'utf8', stdio: ['pipe', 'pipe', 'ignore'] }).trim();
            } catch {
              return '';
            }
          }

          const rangeSpec = lastTag ? `${lastTag}..HEAD` : '-n 40';
          const rawCommits = runGit(
            lastTag
              ? `git log "${lastTag}..HEAD" --no-merges --pretty=format:"%h|%s"`
              : `git log -n 40 --no-merges --pretty=format:"%h|%s"`
          );

          const rawNameStatus = runGit(
            lastTag
              ? `git diff --name-status "${lastTag}" HEAD`
              : `git show --name-status --pretty="" HEAD`
          );

          const rawNumStat = runGit(
            lastTag
              ? `git diff --numstat "${lastTag}" HEAD`
              : `git show --numstat --pretty="" HEAD`
          );

          const rawShortStat = runGit(
            lastTag
              ? `git diff --shortstat "${lastTag}" HEAD`
              : `git show --shortstat --pretty="" HEAD`
          );

          // Parse commit subjects into Highlights vs Fixes/Improvements
          const highlights = [];
          const fixes = [];

          if (customNotes) {
            highlights.push(customNotes);
          }

          const commitLines = rawCommits
            .split('\n')
            .map((l) => l.trim())
            .filter(Boolean);

          for (const line of commitLines) {
            const [hash, ...subjectParts] = line.split('|');
            const subject = subjectParts.join('|').trim();
            if (!subject || /^chore\(release\):/i.test(subject)) continue;

            const cleanSubject = subject.replace(/^(feat|fix|chore|refactor|perf|style|docs|ci)(\([^)]+\))?:\s*/i, '');
            const formattedEntry = `${cleanSubject.charAt(0).toUpperCase() + cleanSubject.slice(1)} (${hash})`;

            if (/^(fix|bug|hotfix|patch|perf|refactor|security|chore)/i.test(subject) || /\b(fix|fixed|bug|error|crash|stability|fallback|retry)\b/i.test(subject)) {
              fixes.push(formattedEntry);
            } else {
              highlights.push(formattedEntry);
            }
          }

          // Parse file diffs & numstat to describe modified components, services, and workflows
          const numStatMap = new Map();
          for (const line of rawNumStat.split('\n').filter(Boolean)) {
            const parts = line.split(/\s+/);
            if (parts.length >= 3) {
              const added = parts[0] === '-' ? 0 : Number(parts[0]) || 0;
              const deleted = parts[1] === '-' ? 0 : Number(parts[1]) || 0;
              const filePath = parts.slice(2).join(' ');
              numStatMap.set(filePath, { added, deleted });
            }
          }

          function describeComponentArea(filePath) {
            if (filePath.startsWith('src/services/aiService')) return 'AI Backend Service & Model Format Engine';
            if (filePath.startsWith('src/context/StoreContext')) return 'Workspace State, Auto-Save & Provider Credential Vault';
            if (filePath.startsWith('src/components/CharacterEditor')) return 'Character Card Workbench & Wizard';
            if (filePath.startsWith('src/components/LorebookEditor')) return 'Lorebook / World Info Workbench & Wizard';
            if (filePath.startsWith('src/components/TagSelector')) return 'Tag & Sub-Tag Selector Bar';
            if (filePath.startsWith('src/components/SmartEditor')) return 'Synchronized Macro & Ghost-Text SmartEditor';
            if (filePath.startsWith('src/views/OptionsView')) return 'Options, AI Scanner & Save Folder Manager';
            if (filePath.startsWith('src/views/ThemesAndTagsView')) return 'Context Themes & Global Tag/Sub-Tag Manager';
            if (filePath.startsWith('src/utils/folderDb')) return 'IndexedDB & Native Directory Handle Persistence';
            if (filePath.startsWith('src/utils/cardIO')) return 'PNG tEXt Chunk & JSON Import/Export Parser';
            if (filePath.startsWith('.github/workflows/')) return 'GitHub Actions CI/CD & Standalone Release Workflow';
            if (filePath.startsWith('src/components/')) return 'UI Workbench Component';
            if (filePath.startsWith('src/views/')) return 'Application Workspace View';
            if (filePath.startsWith('src/utils/')) return 'Core Utility Module';
            return 'Project Configuration & Metadata';
          }

          const fileChanges = [];
          const addedFiles = [];

          for (const line of rawNameStatus.split('\n').filter(Boolean)) {
            const parts = line.split(/\s+/);
            const status = parts[0] || 'M';
            const filePath = parts.slice(1).join(' ');
            if (!filePath || filePath === 'package-lock.json') continue;

            const stat = numStatMap.get(filePath);
            const diffBadge = stat ? ` (+${stat.added} / -${stat.deleted} lines)` : '';
            const areaDesc = describeComponentArea(filePath);
            const actionVerb =
              status.startsWith('A')
                ? 'Added'
                : status.startsWith('D')
                  ? 'Removed'
                  : status.startsWith('R')
                    ? 'Renamed'
                    : 'Updated';

            if (status.startsWith('A')) {
              addedFiles.push(`${filePath} (${areaDesc})`);
            }
            fileChanges.push(`${filePath} — ${actionVerb} ${areaDesc}${diffBadge}`);
          }

          if (addedFiles.length > 0 && highlights.length === 0) {
            highlights.push(`Added new modules: ${addedFiles.join(', ')}`);
          }

          if (highlights.length === 0) {
            highlights.push(
              `Automated release ${tagName} incorporating ${fileChanges.length || 1} updated module(s)${rawShortStat ? ` (${rawShortStat})` : ''}.`
            );
          }

          if (fixes.length === 0) {
            fixes.push(
              'Verified TypeScript compilation, zero-crash sandbox storage guards, and cross-platform standalone launcher compatibility.'
            );
          }

          if (fileChanges.length === 0) {
            fileChanges.push('package.json & CHANGELOG.md — Version bump and release metadata sync');
          }

          // 1. Prepend structured multi-section entry to CHANGELOG.md
          const changelogPath = 'CHANGELOG.md';
          let existingChangelog = fs.existsSync(changelogPath)
            ? fs.readFileSync(changelogPath, 'utf8')
            : '# Changelog\n\nAll notable changes to **TavernSmith** are documented in this file.\n';

          let mdEntry = `## [${tagName}] - ${releaseDate}\n\n`;
          mdEntry += `### 🚀 Highlights & Feature Additions\n`;
          for (const h of highlights) {
            mdEntry += `- ${h}\n`;
          }
          mdEntry += `\n### 🛠️ Bug Fixes, AI & Stability Improvements\n`;
          for (const f of fixes) {
            mdEntry += `- ${f}\n`;
          }
          mdEntry += `\n### 📂 Detailed Component & File Changes\n`;
          if (rawShortStat) {
            mdEntry += `- **Repository Diff Summary**: ${rawShortStat}\n`;
          }
          for (const fc of fileChanges) {
            mdEntry += `- \`${fc}\`\n`;
          }
          mdEntry += `\n`;

          const firstHeadingIdx = existingChangelog.indexOf('\n## [');
          const updatedChangelog =
            firstHeadingIdx !== -1
              ? existingChangelog.slice(0, firstHeadingIdx + 1) +
                mdEntry +
                existingChangelog.slice(firstHeadingIdx + 1)
              : existingChangelog.trimEnd() + '\n\n' + mdEntry;

          fs.writeFileSync(changelogPath, updatedChangelog, 'utf8');
          console.log(`Updated CHANGELOG.md with ${tagName}`);

          // 2. Write synced src/versionInfo.json
          fs.writeFileSync(
            'src/versionInfo.json',
            JSON.stringify(
              {
                version: newVersion,
                releaseDate,
                tagName,
              },
              null,
              2
            ) + '\n',
            'utf8'
          );

          // 3. Update src/utils/changelogData.ts so in-app About & Changelog modal is 100% synced
          const changelogDataPath = 'src/utils/changelogData.ts';
          let existingReleases = [];
          if (fs.existsSync(changelogDataPath)) {
            const rawTs = fs.readFileSync(changelogDataPath, 'utf8');
            const match = rawTs.match(/export const CHANGELOG_RELEASES:\s*ChangelogReleaseEntry\[\]\s*=\s*(\[[\s\S]*\]);/);
            if (match) {
              try {
                existingReleases = Function(`"use strict"; return (${match[1]});`)();
              } catch {
                existingReleases = [];
              }
            }
          }

          const newReleaseObj = {
            version: tagName,
            date: releaseDate,
            title: customNotes || highlights[0] || `TavernSmith ${tagName} Release`,
            highlights,
            fixes,
            fileChanges: fileChanges.slice(0, 25),
          };

          const mergedReleases = [
            newReleaseObj,
            ...existingReleases.filter((r) => r && r.version !== tagName),
          ].slice(0, 15);

          const tsOutput = `export interface ChangelogReleaseEntry {
  version: string;
  date: string;
  title: string;
  highlights: string[];
  fixes: string[];
  fileChanges: string[];
}

export const APP_VERSION = ${JSON.stringify(newVersion)};

export const CHANGELOG_RELEASES: ChangelogReleaseEntry[] = ${JSON.stringify(mergedReleases, null, 2)};
`;

          fs.writeFileSync(changelogDataPath, tsOutput, 'utf8');
          console.log(`Synced src/utils/changelogData.ts and src/versionInfo.json to v${newVersion}`);
          EOF

      - name: Commit Updated Version, CHANGELOG.md & In-App Changelog Module and Push Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TAG_NAME="${{ steps.version_step.outputs.tag_name }}"

          git add package.json CHANGELOG.md src/versionInfo.json src/utils/changelogData.ts
          git commit -m "chore(release): ${TAG_NAME}"
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"

          # Push commit to main and push the new version tag
          git push origin HEAD:main
          git push origin "${TAG_NAME}"
