name: Standalone Release Push & PWA Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    name: Build Standalone Universal Bundle & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 24 (Native Action, No Lockfile Cache)
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript Verification
        run: npm run lint

      - name: Build Production Standalone Bundle
        run: npm run build

      - name: Generate Standalone Desktop Launchers (Windows, macOS x64/ARM, Linux)
        run: |
          cat << 'EOF' > dist/Launch-TavernSmith-Windows.bat
          @echo off
          setlocal
          title TavernSmith Standalone Launcher
          cd /d "%~dp0"
          set PORT=4173

          echo ===================================================
          echo   TavernSmith - SillyTavern V2/V3 Character IDE
          echo ===================================================
          echo.

          where python >nul 2>nul
          if %ERRORLEVEL% EQU 0 (
            echo Starting local TavernSmith server via Python on http://127.0.0.1:%PORT% ...
            start "" msedge --app="http://127.0.0.1:%PORT%" 2>nul || start "" chrome --app="http://127.0.0.1:%PORT%" 2>nul || start "" "http://127.0.0.1:%PORT%"
            python -m http.server %PORT% --bind 127.0.0.1
            goto :eof
          )

          where npx >nul 2>nul
          if %ERRORLEVEL% EQU 0 (
            echo Starting local TavernSmith server via Node.js on http://127.0.0.1:%PORT% ...
            start "" msedge --app="http://127.0.0.1:%PORT%" 2>nul || start "" chrome --app="http://127.0.0.1:%PORT%" 2>nul || start "" "http://127.0.0.1:%PORT%"
            npx --yes serve -s . -l tcp://127.0.0.1:%PORT%
            goto :eof
          )

          echo Opening TavernSmith directly in standalone app window...
          start "" msedge --app="file:///%~dp0index.html" 2>nul || start "" chrome --app="file:///%~dp0index.html" 2>nul || start "" "%~dp0index.html"
          EOF

          cat << 'EOF' > dist/Launch-TavernSmith-Mac-Linux.command
          #!/usr/bin/env bash
          cd "$(dirname "$0")" || exit 1
          PORT=4173
          URL="http://127.0.0.1:${PORT}"

          echo "==================================================="
          echo "  TavernSmith — SillyTavern V2/V3 Character IDE"
          echo "  Universal Launcher (macOS Intel/ARM & Linux)"
          echo "==================================================="

          open_url() {
            if [[ "$OSTYPE" == "darwin"* ]]; then
              open "$1"
            elif command -v xdg-open >/dev/null 2>&1; then
              xdg-open "$1" >/dev/null 2>&1 &
            fi
          }

          if command -v python3 >/dev/null 2>&1; then
            echo "Starting local TavernSmith server on ${URL} (Press Ctrl+C to stop)..."
            (sleep 1 && open_url "${URL}") &
            python3 -m http.server "${PORT}" --bind 127.0.0.1
          elif command -v python >/dev/null 2>&1; then
            echo "Starting local TavernSmith server on ${URL} (Press Ctrl+C to stop)..."
            (sleep 1 && open_url "${URL}") &
            python -m SimpleHTTPServer "${PORT}"
          elif command -v npx >/dev/null 2>&1; then
            echo "Starting local TavernSmith server via Node on ${URL} (Press Ctrl+C to stop)..."
            (sleep 2 && open_url "${URL}") &
            npx --yes serve -s . -l "tcp://127.0.0.1:${PORT}"
          else
            echo "Opening index.html directly in your default browser..."
            open_url "./index.html"
          fi
          EOF

          chmod +x dist/Launch-TavernSmith-Mac-Linux.command

          cat << 'EOF' > dist/README-STANDALONE.txt
          TavernSmith — Universal Standalone Distribution
          ===============================================
          Compatible with Windows (x64/ARM64), macOS (Intel x64 & Apple Silicon M1/M2/M3/M4),
          Linux, iOS/iPadOS, and Android.

          1. WINDOWS:
             Double-click "Launch-TavernSmith-Windows.bat".

          2. macOS (Intel & Apple Silicon ARM) / LINUX:
             Double-click "Launch-TavernSmith-Mac-Linux.command"
             (or run `./Launch-TavernSmith-Mac-Linux.command` in Terminal).

          3. INSTALL AS NATIVE-LIKE PWA (Desktop, Android, iOS/iPadOS):
             When opened in Chrome, Edge, Brave, or Safari, click "Install App" in the top bar
             (or Share -> "Add to Home Screen" on iOS/iPadOS) to run TavernSmith in its own
             dedicated standalone application window with full offline support.
          EOF

      - name: Zip dist/ into TavernSmith-Standalone-Universal.zip
        run: |
          cd dist
          zip -r ../TavernSmith-Standalone-Universal.zip .

      - name: Extract Latest Release Notes & Publish GitHub Release via GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const pkg = require('./package.json');
          const changelog = fs.existsSync('CHANGELOG.md')
            ? fs.readFileSync('CHANGELOG.md', 'utf8')
            : '';

          let notes = '';
          const sections = changelog.split(/\n(?=## \[)/);
          const firstReleaseSection = sections.find((s) => s.trim().startsWith('## ['));
          if (firstReleaseSection) {
            notes = firstReleaseSection.trim();
          } else {
            notes = `## TavernSmith v${pkg.version}\n\nUniversal Standalone Release for Windows, macOS (x64 & Apple Silicon ARM), Linux, iOS, and Android.`;
          }

          fs.writeFileSync('RELEASE_NOTES.md', notes + '\n', 'utf8');
          EOF

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi

          echo "Publishing GitHub Release for tag: $TAG"
          gh release create "$TAG" TavernSmith-Standalone-Universal.zip \
            --title "TavernSmith $TAG" \
            --notes-file RELEASE_NOTES.md \
            --clobber || \
          gh release upload "$TAG" TavernSmith-Standalone-Universal.zip --clobber
